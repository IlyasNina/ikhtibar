','n','o','p','q']];\nfunction genReading(){\n  const T=pick(TEMPLATES), flip=Math.random()<.5, th=rnd(-12,12), rot=(p)=>{ const r=th*Math.PI/180, x=p[0]-170, y=p[1]-105; return [170+x*Math.cos(r)-y*Math.sin(r), 105+x*Math.sin(r)+y*Math.cos(r)]; };\n  const angs=[]; T.forEach((l,i)=>{ let a=l.f!==undefined?angs[l.f]:l.a+(l.j?rnd(-10,10):0); angs.push(a); });\n  const letters=shuffle(pick(LETTERS)).slice(0,T.length);\n  const lines={}, ids=[];\n  T.forEach((l,i)=>{\n    let c=l.c, a=angs[i]; if(flip){ c=[340-c[0],c[1]]; a=180-a; }\n    c=rot(c); a=a+th; const e=clipLine(c,a,FRECT); if(!e) return;\n    lines[letters[i]]={p1:e[0],p2:e[1],label:[0,0]}; ids.push(letters[i]);\n  });\n  const placed=[]; ids.forEach(id=>{ const l=lines[id]; let e=l.p2;\n    const place=(e)=>[Math.max(4,Math.min(312,e[0]+(e[0]>170?-26:8))),Math.max(18,Math.min(200,e[1]+(e[1]>105?-8:20)))];\n    let p=place(e); if(placed.some(q=>dist(q,p)<26)){ p=place(l.p1); } placed.push(p); l.label=p; });\n  const rel=(x,y)=>{ const d=angDiff(angleOf(lines[x]),angleOf(lines[y])); return d<1.5?'par':d>88.5?'perp':'sec'; };\n  const inside=P=>P&&P[0]>26&&P[0]<314&&P[1]>28&&P[1]<184;\n  const showMarks=Math.random()<.5, marks=[], pool={par:[],perp:[],sec:[]};\n  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){\n    const x=ids[i], y=ids[j], r=rel(x,y), P=inter(lines[x],lines[y]);\n    if(r==='par') pool.par.push([x,y]);\n    else if(inside(P)){ pool[r].push([x,y]);\n      if(r==='perp' && showMarks){ const v=[170-P[0],105-P[1]]; let d1=dirOf(lines[x]), d2=dirOf(lines[y]); if(dot(d1,v)<0) d1=mul(d1,-1); if(dot(d2,v)<0) d2=mul(d2,-1); marks.push({at:P,dirs:[d1,d2]}); } }\n  }\n  let chosen=[]; ['par','perp','sec'].forEach(k=>{ if(pool[k].length) chosen.push([k,pick(pool[k])]); });\n  const rest=[]; ['par','perp','sec'].forEach(k=>pool[k].forEach(pr=>rest.push([k,pr])));\n  while(chosen.length<3 && rest.length){ const c=pick(rest); if(!chosen.some(q=>q[1]===c[1])) chosen.push(c); else rest.splice(r يتكبر\": \"se montre orgueilleux\", \"اصدقائه\": \"ses amis\", \"يدرس\": \"étudie\", \"مظاهر\": \"signes\", \"وفاء\": \"tenir (sa parole)\", \"وعد\": \"la promesse\", \"خشية\": \"la crainte (d'Allah)\", \"اي\": \"c'est-à-dire\", \"سلاما\": \"paix (parole de paix)\", \"نبتعد\": \"nous nous éloignons\", \"فخر\": \"la vantardise\", \"يحمينا\": \"nous protège\", \"قالوا\": \"ils disent\", \"جهل\": \"l'ignorance\", \"سريعا\": \"vite\", \"ادب\": \"la politesse\", \"وضعية\": \"situation\", \"ادماجية\": \"d'intégration\", \"زاركم\": \"vous a rendu visite\", \"جاركم\": \"votre voisin\", \"جديد\": \"nouveau\", \"سعيد\": \"Saïd (prénom)\", \"بيت\": \"la maison\", \"اخبرته\": \"je lui ai dit\", \"انك\": \"que tu\", \"تتعلم\": \"tu apprends\", \"مدرسة\": \"l'école\", \"درس\": \"leçon\", \"كيف\": \"comment\", \"تستقبل\": \"tu accueilles\", \"جارك\": \"ton voisin\", \"اسلم\": \"je salue\", \"ابتسم\": \"je souris\", \"اتجاهله\": \"je l'ignore\", \"ازعجه\": \"je le dérange\", \"متي\": \"quand\", \"قليلا\": \"peu\", \"يوم\": \"jour\", \"اذكر\": \"cite\", \"فائدة\": \"un bienfait\", \"كي\": \"pour que\", \"يخدعنا\": \"nous trompe\", \"ينقص\": \"diminue\", \"قال\": \"a dit\", \"انه\": \"qu'il\", \"يريد\": \"veut\", \"يتصدق\": \"donne l'aumône\", \"ليمدحوه\": \"pour le féliciter\", \"بماذا\": \"par quoi ?\", \"تنصحه\": \"tu lui conseilles\", \"نعمل\": \"nous faisons\", \"نتصدق\": \"nous donnons l'aumône\", \"حتي\": \"jusqu'à ce que\", \"يرونا\": \"ils nous voient\", \"ابدا\": \"jamais\", \"مراجعة\": \"révision\", \"شاملة\": \"complète\", \"تربية\": \"éducation\", \"اسلامية\": \"islamique\", \"الاسلام\": \"l'islam\", \"السلام\": \"la paix\"};\nconst DICT={};for(const k in RAW)DICT[norm(k)]=RAW[k];\nconst PRE=['وال','بال','فال','كال','لل','ال','و','ف','ب','ل','ك'];\nfunction lookup(w){\n  const k=norm(w);const seen=[k];\n  for(let r=0;r<2;r++){seen.slice().forEach(x=>PRE.forEach(p=>{if(x.startsWith(p)&&x.length>p.length+1){seen.push(x.slice(p.length));if(p==='لل')seen.push('ل'+x.slice(2));}}));}\n  for(const c of seen){if(DICT[c])return DICT[c];}\n  return null;\n}\nconst bubble=document.getElementById('bubble');let bt;\nfunction showBubble(t,text){bubble.textContent=text;bubble.style.display='block';const r=t.getBoundingClientRect(),b=bubble.getBoundingClientRect();let l=r.left+r.width/2-b.width/2;l=Math.max(8,Math.min(l,innerWidth-b.width-8));let tp=r.top-b.height-10;if(tp<8)tp=r.bottom+10;bubble.style.left=l+'px';bubble.style.top=tp+'px';clearTimeout(bt);bt=setTimeout(()=>bubble.style.display='none',3500);}\ndocument.addEventListener('pointerdown',e=>{if(!e.target.closest('.w'))bubble.style.display='none';});\nfunction wrap(text,parent){\n  const re=/\\{([^}]+)\\}|(\\d+)|([؀-ۿ]+)|([^؀-ۿ\\d{]+)/g;let m;\n  while((m=re.exec(text))){\n    if(m[1]||m[2]){const s=document.createElement('span');s.textContent=m[1]||m[2];parent.appendChild(s);}\n    else if(m[3]){const fr=lookup(m[3]);const s=document.createElement('span');s.textContent=m[3];if(fr){s.className='w';s.addEventListener('click',()=>showBubble(s,fr));}parent.appendChild(s);}\n    else parent.appendChild(document.createTextNode(m[4]));\n  }\n  return parent;\n}\nconst T=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text)wrap(text,e);return e;};\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\nconst shake=el=>el.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:250});\nconst BAD='لَا، حَاوِلْ مَرَّةً أُخْرَى.';\nconst LCOL=['#be185d','#6d28d9','#1d4ed8','#c2410c','#0f766e','#a16207'];\nfunction setFb(fb,cls,text){fb.className='fb '+cls;fb.textContent='';wrap(text,fb);}\n\n/* ---------- relier ---------- */\nfunction buildMatch(body,pairs,done){\n  const n=pairs.length;\n  const A=pairs.map((p,i)=>({t:p[0],i})),B=shuffle(pairs.map((p,i)=>({t:p[1],i})));\n  let links=[],selA=null,selB=null,fin=false;\n  const grid=T('div','match'),cA=T('div','mcol'),cB=T('div','mcol');grid.append(cA,cB);body.appendChild(grid);\n  const chk=T('button','chk','تَحَقَّقْ');body.appendChild(chk);const fb=T('div','fb');body.appendChild(fb);\n  const lk=(side,i)=>links.find(l=>l[side]===i);\n  function draw(){\n    cA.textContent='';cB.textContent='';\n    [[A,cA,'a',selA],[B,cB,'b',selB]].forEach(([arr,col,side,sel])=>arr.forEach(it=>{\n      const b=T('button','itm',it.t);const l=lk(side,it.i);\n      if(l){b.classList.add('lk');b.style.borderColor=LCOL[l.c];b.style.background=LCOL[l.c]+'22';if(l.s)b.classList.add(l.s);}\n      else if(sel===it.i)b.classList.add('sel');\n      b.onclick=ev=>{\n        if(ev.target.closest('.w'))return;\n        if(fin)return;\n        const x=lk(side,it.i);\n        if(x){links=links.filter(y=>y!==x);fb.className='fb';}\n        else{if(side==='a')selA=(selA===it.i?null:it.i);else selB=(selB===it.i?null:it.i);\n          if(selA!==null&&selB!==null){const used=links.map(y=>y.c);let c=0;while(used.includes(c))c++;links.push({a:selA,b:selB,c,s:''});selA=null;selB=null;}}\n        draw();};\n      col.appendChild(b);}));\n  }\n  chk.onclick=()=>{\n    if(links.length<n){setFb(fb,'bad','اِرْبِطِ الكُلَّ أَوَّلًا.');return;}\n    let bad=0;links.forEach(l=>{if(l.s==='ok')return;if(l.a===l.b)l.s='ok';else{if(l.s!=='bad'&&window.__logErr)window.__logErr(body,A[l.a].t+' ↔ '+B.find(x=>x.i===l.b).t,'');l.s='bad';bad++;}});\n    draw();\n    if(bad){setFb(fb,'bad','بَعْضُ الرَّوَابِطِ خَاطِئَةٌ. اِلْمَسْهَا لِتُزِيلَهَا ثُمَّ حَاوِلْ مَرَّةً أُخْرَى.');}\n    else{fin=true;chk.disabled=true;setFb(fb,'good','أَحْسَنْتَ!');done();}\n  };\n  draw();\n}\n\n/* ---------- remplir ---------- */\nfunction buildFill(body,tpl,answers,bank,done){\n  const parts=tpl.split('___');const nb=answers.length;\n  const chips=shuffle(bank.map((t,i)=>({t,id:i})));\n  const place=Array(nb).fill(null),st=Array(nb).fill('');\n  let armedC=null,armedB=null,fin=false;\n  const para=T('div','para'),tray=T('div','chips');body.append(para,tray);\n  const chk=T('button','chk','تَحَقَّقْ');body.appendChild(chk);const fb=T('div','fb');body.appendChild(fb);\n  const put=(c,b)=>{place[b]=c;st[b]='';armedC=null;armedB=null;fb.className='fb';draw();};\n  function draw(){\n    para.textContent='';\n    parts.forEach((p,i)=>{\n      wrap(p,para);\n      if(i<nb){\n        const bl=document.createElement('button');bl.className='blank';\n        if(place[i]!==null){bl.classList.add('filled');if(st[i])bl.classList.add(st[i]);bl.textContent=bank[place[i]];}\n        else if(armedB===i)bl.classList.add('armed');\n        else bl.innerHTML='&nbsp;';\n        bl.onclick=()=>{\n          if(fin||st[i]==='ok')return;\n          if(place[i]!==null){if(armedC!==null){put(armedC,i);}else{place[i]=null;st[i]='';fb.className='fb';draw();}}\n          else if(armedC!==null)put(armedC,i);\n          else{armedB=(armedB===i?null:i);draw();}\n        };\n        para.appendChild(bl);\n      }\n    });\n    tray.textContent='';\n    chips.forEach(c=>{\n      const b=T('button','chip',c.t);\n      if(place.includes(c.id))b.classList.add('used');\n      else if(armedC===c.id)b.classList.add('sel');\n      b.onclick=ev=>{if(ev.target.closest('.w'))return;\n        if(armedB!==null)put(c.id,armedB);else{armedC=(armedC===c.id?null:c.id);draw();}};\n      tray.appendChild(b);});\n  }\n  chk.onclick=()=>{\n    if(place.includes(null)){setFb(fb,'bad','أَكْمِلْ كُلَّ الفَرَاغَاتِ أَوَّلًا.');return;}\n    let bad=0;place.forEach((c,i)=>{if(st[i]==='ok')return;if(c===i)st[i]='ok';else{if(st[i]!=='bad'&&window.__logErr)window.__logErr(body,bank[c],parts[i].slice(-160)+' ___ '+(parts[i+1]||'').slice(0,60));st[i]='bad';bad++;}});\n    draw();\n    if(bad)setFb(fb,'bad','بَعْضُ الكَلِمَاتِ خَاطِئَةٌ. اِلْمَسْهَا لِتُزِيلَهَا ثُمَّ حَاوِلْ مَرَّةً أُخْرَى.');\n    else{fin=true;chk.disabled=true;setFb(fb,'good','أَحْسَنْتَ!');done();}\n  };\n  draw();\n}\n\n/* ---------- classer ---------- */\nfunction buildClassify(body,cols,items,done){\n  const pos=items.map(()=>-1),st=items.map(()=>'');const order=shuffle(items.map((_,i)=>i));\n  let armed=null,fin=false;\n  const tray=T('div','tray'),grid=T('div','cols');body.append(tray,grid);\n  const chk=T('button','chk','تَحَقَّقْ');body.appendChild(chk);const fb=T('div','fb');body.appendChild(fb);\n  function draw(){\n    tray.textContent='';grid.textContent='';\n    order.forEach(i=>{if(pos[i]!==-1)return;const b=T('button','pl',items[i].t);if(armed===i)b.classList.add('sel');\n      b.onclick=ev=>{if(ev.target.closest('.w'))return;armed=(armed===i?null:i);draw();};tray.appendChild(b);});\n    cols.forEach((c,ci)=>{\n      const col=T('div','col k'+ci);if(armed!==null)col.classList.add('armed');\n      col.appendChild(T('div','hd',c));const bd=T('div','bd');col.appendChild(bd);\n      order.forEach(i=>{if(pos[i]!==ci)return;const b=T('button','pl',items[i].t);if(st[i])b.classList.add(st[i]);\n        b.onclick=ev=>{ev.stopPropagation();if(ev.target.closest('.w'))return;if(fin||st[i]==='ok')return;pos[i]=-1;st[i]='';fb.className='fb';draw();};bd.appendChild(b);});\n      col.onclick=()=>{if(fin||armed===null)return;pos[armed]=ci;st[armed]='';armed=null;fb.className='fb';draw();};\n      grid.appendChild(col);});\n  }\n  chk.onclick=()=>{\n    if(pos.includes(-1)){setFb(fb,'bad','صَنِّفِ الجُمَلَ كُلَّهَا أَوَّلًا.');return;}\n    let bad=0;items.forEach((it,i)=>{if(st[i]==='ok')return;if(pos[i]===it.c)st[i]='ok';else{if(st[i]!=='bad'&&window.__logErr)window.__logErr(body,it.t,'');st[i]='bad';bad++;}});\n    draw();\n    if(bad)setFb(fb,'bad','بَعْضُ الجُمَلِ فِي مَكَانٍ خَاطِئٍ. اِلْمَسْهَا لِتُزِيلَهَا ثُمَّ حَاوِلْ مَرَّةً أُخْرَى.');\n    else{fin=true;chk.disabled=true;setFb(fb,'good','أَحْسَنْتَ!');done();}\n  };\n  draw();\n}\n\n/* ---------- صحيح أم خطأ ---------- */\nfunction buildTF(body,list,done){\n  let left=list.length;\n  list.forEach((s,i)=>{\n    const row=T('div','row');row.appendChild(T('div','stmt',(i+1)+') '+s.t));\n    const tf=T('div','tf');const fb=T('div','fb');\n    [['صَحِيحٌ ✔',true],['خَطَأٌ ✘',false]].forEach(([lab,v])=>{\n      const b=T('button','tfb',lab);\n      b.onclick=ev=>{if(ev.target.closest('.w'))return;\n        if(v!==s.v){b.classList.add('bad');shake(b);setFb(fb,'bad',BAD);return;}\n        tf.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add('good');\n        setFb(fb,'good',s.v?'أَحْسَنْتَ!':'أَحْسَنْتَ! التَّصْحِيحُ: '+s.fix);\n        if(--left===0)done();};\n      tf.appendChild(b);});\n    row.append(tf,fb);body.appendChild(row);});\n}\n\n/* ---------- QCM ---------- */\nfunction buildQCM(body,list,done){\n  let left=list.length;\n  list.forEach((q,i)=>{\n    const row=T('div','row');row.appendChild(T('div','stmt',(i+1)+') '+q.q));\n    const o=T('div','opts');const fb=T('div','fb');\n    shuffle(q.o.map((t,k)=>({t,ok:k===0}))).forEach(x=>{\n      const b=T('button','chip',x.t);\n      b.onclick=ev=>{if(ev.target.closest('.w'))return;\n        if(!x.ok){b.classList.add('bad');shake(b);setFb(fb,'bad',BAD);return;}\n        o.querySelectorAll('button').forEach(y=>y.disabled=true);b.classList.add('good');\n        setFb(fb,'good','أَحْسَنْتَ! '+(q.ex||''));\n        if(--left===0)done();};\n      o.appendChild(b);});\n    row.append(o,fb);body.appendChild(row);});\n}\n\n/* ---------- les exercices (leçons mélangées) ---------- */\nconst DATA=[\n {ask:'اِرْبِطْ كُلَّ كِتَابٍ بِالنَّبِيِّ الَّذِي أُنْزِلَ عَلَيْهِ.',t:'match',pairs:[\n  ['الصُّحُفُ','أُنْزِلَتْ عَلَى سَيِّدِنَا إِبْرَاهِيمَ عَلَيْهِ السَّلَامُ'],\n  ['الزَّبُورُ','أُنْزِلَ عَلَى سَيِّدِنَا دَاوُودَ عَلَيْهِ السَّلَامُ'],\n  ['التَّوْرَاةُ','أُنْزِلَتْ عَلَى سَيِّدِنَا مُوسَى عَلَيْهِ السَّلَامُ'],\n  ['الإِنْجِيلُ','أُنْزِلَ عَلَى سَيِّدِنَا عِيسَى عَلَيْهِ السَّلَامُ'],\n  ['القُرْآنُ الكَرِيمُ','أُنْزِلَ عَلَى سَيِّدِنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ']]},\n {ask:'صَحِيحٌ أَمْ خَطَأٌ؟',t:'tf',list:[\n  {t:'الزَّكَاةُ هِيَ الرُّكْنُ الثَّالِثُ م s:[\n  {t:'المُحِيطُ الهَادِي',c:0,l:G2},{t:'المُحِيطُ الأَطْلَسِيُّ',c:0,l:G2},{t:'البَحْرُ الأَبْيَضُ المُتَوَسِّطُ',c:0,l:G2},\n  {t:'إِفْرِيقِيَا',c:1,l:G2},{t:'آسِيَا',c:1,l:G2},{t:'أُورُوبَّا',c:1,l:G2}]},\n {ask:'الوَضْعِيَّةُ الإِدْمَاجِيَّةُ',t:'qcm',intro:'زَارَكَ ابْنُ عَمِّكَ المُقِيمُ فِي فَرَنْسَا وَسَأَلَكَ عَنْ بَلَدِكَ الجَزَائِرِ وَعَنْ تَارِيخِهَا.',list:[\n  {q:'أَيْنَ تَقَعُ الجَزَائِرُ؟',o:['فِي شَمَالِ قَارَّةِ إِفْرِيقِيَا','فِي جَنُوبِ قَارَّةِ آسِيَا','فِي وَسَطِ أُورُوبَّا'],l:G4},\n  {q:'مَنْ يُجَاوِرُ الجَزَائِرَ مِنَ الشَّرْقِ؟',o:['تُونُسُ وَلِيبِيَا','مَالِي وَالنِّيجَرُ','المَغْرِبُ وَمُورِيتَانِيَا'],l:G4},\n  {q:'أَيُّ مُنَاخٍ يَسُودُ فِي جَنُوبِ الجَزَائِرِ؟',o:['المُنَاخُ الصَّحْرَاوِيُّ','المُنَاخُ المُتَوَسِّطِيُّ','المُنَاخُ القَارِّيُّ'],l:G5},\n  {q:'مَتَى اسْتَقَلَّتِ الجَزَائِرُ؟',o:['سَنَةَ 1962 م','سَنَةَ 1954 م','سَنَةَ 1830 م'],l:H4},\n  {q:'مَتَى اِنْدَلَعَتِ الثَّوْرَةُ التَّحْرِيرِيَّةُ؟',o:['سَنَةَ 1954 م','سَنَةَ 1962 م','سَنَةَ 1830 م'],l:H4},\n  {q:'مَتَى اِحْتَلَّتْ فَرَنْسَا الجَزَائِرَ؟',o:['سَنَةَ 1830 م','سَنَةَ 1518 م','سَنَةَ 1954 م'],l:H4}]}\n];\nconst MODE='hist';\nconst PFX=MODE==='geo'?'Géo':'Histoire';\nconst lOf=d=>d.t==='tf'||d.t==='qcm'?(d.list.find(x=>x.l.startsWith(PFX))||{}).l:d.t==='match'?d.pairs[0][2]:d.t==='cls'?d.items[0].l:d.t==='fill'||d.t==='slots'?d.lt:'Géo';\nconst DATA2=[];\nDATA.forEach(d=>{\n  if(d.t==='tf'||d.t==='qcm'){const list=d.list.filter(x=>x.l.startsWith(PFX));if(list.length)DATA2.push(Object.assign({},d,{list}));}\n  else if((lOf(d)||'').startsWith(PFX))DATA2.push(d);\n});\nDATA.length=0;DATA2.forEach(x=>DATA.push(x));\n/* ---------- assemblage ---------- */\n\nfunction rappelBox(){\n  const G=[['جَانْفِي','janvier'],['فِيفْرِي','février'],['مَارْس','mars'],['أَفْرِيل','avril'],['مَايْ','mai'],['جُوَان','juin'],['جُوِيلِيَة','juillet'],['أُوت','août'],['سِبْتَمْبِر','septembre'],['أُكْتُوبِر','octobre'],['نُوفَمْبِر','novembre'],['دِيسَمْبِر','décembre']];\n  const Hh=[['مُحَرَّم','Mouharram'],['صَفَر','Safar'],['رَبِيع الأَوَّل','Rabi\\' al-awwal'],['رَبِيع الثَّانِي','Rabi\\' ath-thani'],['جُمَادَى الأُولَى','Joumada al-oula'],['جُمَادَى الثَّانِيَة','Joumada ath-thania'],['رَجَب','Rajab'],['شَعْبَان','Chaabane'],['رَمَضَان','Ramadan'],['شَوَّال','Chawwal'],['ذُو القَعْدَة','Dhou al-qi\\'da'],['ذُو الحِجَّة','Dhou al-hijja']];\n  const wrapD=document.createElement('div');wrapD.className='rapw';\n  [['Calendrier grégorien (ميلادي)','Commence à la naissance de Jésus (paix sur lui).',G,'g'],['Calendrier hégirien (هجري)','Commence à l\\'Hégire du Prophète ﷺ (622).',Hh,'h']].forEach(([t,sub,L,c])=>{\n    const bx=document.createElement('div');bx.className='rap '+c;\n    const h=document.createElement('div');h.className='rt';h.textContent=t;bx.appendChild(h);\n    const p=document.createElement('div');p.className='rs';p.textContent=sub;bx.appendChild(p);\n    const m=document.createElement('div');m.className='rm';\n    L.forEach(x=>{const e=document.createElement('span');e.innerHTML='<b>'+x[0]+'<\/b><i>'+x[1]+'<\/i>';m.appendChild(e);});\n    bx.appendChild(m);wrapD.appendChild(bx);});\n  return wrapD;\n}\nlet doneSet=new Set();\nfunction start(){\n  doneSet=new Set();document.getElementById('final').classList.remove('show');\n  const ti=document.getElementById('title');ti.textContent='';wrap(MODE==='geo'?'مُرَاجَعَةٌ فِي الجُغْرَافِيَا':'مُرَاجَعَةٌ فِي التَّارِيخِ',ti);\n  document.getElementById('restart').textContent='مِنْ جَدِيدٍ';\n  const host=document.getElementById('cards');host.textContent='';\n  DATA.forEach((d,i)=>{\n    const card=T('div','card');card.style.borderColor=BADGE[i%6]+'55';\n    const h=document.createElement('h2');const b=document.createElement('span');b.className='badge';b.textContent=i+1;b.style.background=BADGE[i%6];h.appendChild(b);card.appendChild(h);\n    card.appendChild(T('div','ask',d.ask));\n    if(d.intro)card.appendChild(T('div','intro',d.intro));\n    if(d.rappel)card.appendChild(rappelBox());\n    const body=document.createElement('div');card.appendChild(body);host.appendChild(card);\n    const done=()=>{card.classList.add('done');doneSet.add(i);if(doneSet.size===DATA.length)finish();};\n    if(d.t==='match')buildMatch(body,d.pairs,done);\n    else if(d.t==='tf')buildTF(body,d.list,done);\n    else if(d.t==='fill')buildFill(body,d.tpl,d.ans,d.bank,d.lt,done);\n    else if(d.t==='slots')buildSlots(body,d.labels,d.bank,d.lt,done);\n    else if(d.t==='cls')buildClassify(body,d.cols,d.items,done,d.why);\n    else if(d.t==='qcm')buildQCM(body,d.list,done);\n    else if(d.t==='globe')buildGlobe(body,d.prompts,done);\n    else if(d.t==='maplabel')buildMapLabel(body,done);\n  });\n}\nfunction finish(){const f=document.getElementById('final');f.classList.add('show');const m=document.getElementById('finalMsg');m.textContent='';wrap('أَحْسَنْتَ! أَنْهَيْتَ كُلَّ التَّمَارِينِ.',m);f.scrollIntoView({behavior:'smooth',block:'center'});}\ndocument.getElementById('restart').onclick=start;\nstart();\n/* ---------- glisser-déposer (en plus du toucher en 2 temps) ---------- */\n(function(){\n  const SRC='.chips .chip:not(.used), .tray .pl', TGT='.blank, .col, .cty, #gtr, #geq';\n  let d=null,ghost=null,supp=false,raf=0;\n  document.addEventListener('pointerdown',e=>{\n    if(e.pointerType==='mouse'&&e.button!==0)return;\n    const el=e.target.closest&&e.target.closest(SRC);if(!el)return;\n    d={el,x:e.clientX,y:e.clientY,cx:e.clientX,cy:e.clientY,on:false};\n  },true);\n  function scrollLoop(){if(!d||!d.on){raf=0;return;}\n    if(d.cy<70)window.scrollBy(0,-14);else if(d.cy>innerHeight-70)window.scrollBy(0,14);\n    raf=requestAnimationFrame(scrollLoop);}\n  document.addEventListener('pointermove',e=>{\n    if(!d)return;d.cx=e.clientX;d.cy=e.clientY;\n    if(!d.on){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<9)return;\n      d.on=true;const r=d.el.getBoundingClientRect();\n      ghost=d.el.cloneNode(true);ghost.style.cssText='position:fixed;z-index:99;pointer-events:none;opacity:.92;margin:0;width:'+r.width+'px;transform:scale(1.06);box-shadow:0 6px 18px rgba(0,0,0,.3)';\n      document.body.appendChild(ghost);d.el.style.opacity='.35';\n      d.ox=d.x-r.left;d.oy=d.y-r.top;if(!raf)raf=requestAnimationFrame(scrollLoop);}\n    ghost.style.left=(e.clientX-d.ox)+'px';ghost.style.top=(e.clientY-d.oy)+'px';\n    e.preventDefault();\n  },{passive:false,capture:true});\n  function end(e,cancel){\n    if(!d)return;const cur=d;d=null;\n    if(!cur.on)return;\n    if(ghost){ghost.remove();ghost=null;}cur.el.style.opacity='';\n    if(cancel){supp=true;setTimeout(()=>{supp=false;},80);return;}\n    const t=document.elementFromPoint(e.clientX,e.clientY);const tg=t&&t.closest&&t.closest(TGT);\n    if(tg&&tg!==cur.el){\n      cur.el.dispatchEvent(new MouseEvent('click',{bubbles:true}));\n      const again=document.elementFromPoint(e.clientX,e.clientY);const t2=(again&&again.closest&&again.closest(TGT))||tg;\n      t2.dispatchEvent(new MouseEvent('click',{bubbles:true}));\n    }\n    supp=true;setTimeout(()=>{supp=false;},80);\n  }\n  document.addEventListener('pointerup',e=>end(e,false),true);\n  document.addEventListener('pointercancel',e=>end(e,true),true);\n  document.addEventListener('click',e=>{if(supp){e.stopPropagation();e.preventDefault();}},true);\n  const st=document.createElement('style');\n  st.textContent='.chips .chip,.tray .pl{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}';document.head.appendChild(st);\n})();\n<\/script>\n<\/body>\n<\/html>\n",en:"<!DOCTYPE html>\n<html lang=\"en\" dir=\"ltr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>English revision<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#fdf8ee;--card:#fff;--ink:#1f2937;--muted:#6b7280;--teal:#0f766e;--green:#16a34a;--red:#dc2626}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;background:var(--bg);color:var(--ink);font-family:\"Nunito\",\"Trebuchet MS\",system-ui,Arial,sans-serif;touch-action:manipulation}\n.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}\nh1{font-size:32px;margin:0 0 12px;color:#be185d;line-height:1.5}\n.card{background:var(--card);border-radius:22px;box-shadow:0 2px 14px rgba(0,0,0,.08);padding:20px 22px;margin:0 0 22px;border:3px solid transparent}\n.card.done{border-color:var(--green)!important}\n.card h2{margin:0 0 6px;line-height:0;display:flex;align-items:center;gap:12px}\n.badge{width:56px;height:56px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font:800 30px/1 system-ui,sans-serif}\n.tag{font:700 15px/1.6 system-ui,sans-serif;color:#475569;background:#f1f5f9;border-radius:10px;padding:3px 12px}\n.ask{font-size:26px;line-height:1.6;margin:8px 0 12px;font-weight:800}\n.intro{font-size:25px;line-height:1.8;margin:6px 0 12px;background:#f8fafc;border-radius:14px;padding:10px 16px}\n.fb{margin-top:10px;border-radius:14px;padding:8px 14px;font-size:23px;line-height:1.7;display:none;font-weight:700}\n.fb.good{display:block;background:#dcfce7;color:#14532d}\n.fb.bad{display:block;background:#fee2e2;color:#7f1d1d}\n.chk{font:800 26px \"Nunito\",system-ui,sans-serif;margin:12px 0 4px;padding:10px 30px;border-radius:16px;border:3px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}\n.chk:disabled{opacity:.4}\n.chk:active{transform:scale(.97)}\n.match{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px}\n.mcol{display:flex;flex-direction:column;gap:12px}\n.itm{font:700 25px/1.5 \"Nunito\",system-ui,sans-serif;padding:10px 14px;min-height:64px;border-radius:16px;border:3px solid #cbd5e1;background:#fff;color:var(--ink);cursor:pointer;text-align:center;user-select:none;-webkit-user-select:none}\n.itm.big{font-size:36px}\n.itm:active{transform:scale(.97)}\n.itm.sel{border-color:#f59e0b;background:#fef3c7;box-shadow:0 0 0 4px #fde68a}\n.itm.lk{border-width:4px}\n.itm.ok{pointer-events:none}\n.itm.ok::after{content:\" ✔\"}\n.itm.bad{border-color:var(--red)!important;background:#fee2e2!important}\n.para{font-size:28px;line-height:2.5;margin:6px 0 12px}\n.blank{display:inline-block;min-width:130px;min-height:50px;padding:2px 14px;margin:0 4px;border-radius:12px;border:3px dashed #94a3b8;background:#f8fafc;font:800 26px/1.7 \"Nunito\",system-ui,sans-serif;color:var(--ink);cursor:pointer;vertical-align:middle;text-align:center}\n.blank.s{min-width:64px;padding:2px 8px}\n.blank.filled{border-style:solid;border-color:#0f766e;background:#f0fdfa}\n.blank.armed{border-color:#f59e0b;background:#fef3c7}\n.blank.ok{border-color:var(--green);background:#dcfce7;pointer-events:none}\n.blank.bad{border-color:var(--red);background:#fee2e2}\n.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;padding:12px;background:#f8fafc;border-radius:18px;justify-content:center}\n.chip{font:800 26px \"Nunito\",system-ui,sans-serif;padding:8px 20px;min-height:56px;border-radius:16px;border:3px solid #cbd5e1;background:#fff;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none}\n.chip:active{transform:scale(.96)}\n.chip.sel{border-color:#f59e0b;background:#fef3c7;box-shadow:0 0 0 4px #fde68a}\n.chip.used{opacity:.3;pointer-events:none}\n.chip.bad{border-color:var(--red);background:#fee2e2}\n.chip.good{border-color:var(--green);background:#dcfce7}\n.cols{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:12px;margin-top:10px}\n.col{border-radius:18px;border:3px solid;min-height:150px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}\n.col .hd{font-size:25px;font-weight:800;text-align:center;padding:10px 6px;color:#fff;line-height:1.5}\n.col .bd{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px}\n.col.k0{border-color:#15803d;background:#f0fdf4}.col.k0 .hd{background:#15803d}\n.col.k1{border-color:#be185d;background:#fdf2f8}.col.k1 .hd{background:#be185d}\n.col.k2{border-color:#1d4ed8;background:#eff6ff}.col.k2 .hd{background:#1d4ed8}\n.col.armed{box-shadow:0 0 0 4px #fde68a}\n.pl{font:700 24px/1.6 \"Nunito\",system-ui,sans-serif;background:#fff;border:2px solid #94a3b8;border-radius:14px;padding:6px 10px;cursor:pointer;text-align:center}\n.pl.ok{background:#dcfce7;border-color:var(--green);pointer-events:none}\n.pl.bad{background:#fee2e2;border-color:var(--red)}\n.tray{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 6px;padding:12px;background:#f8fafc;border-radius:18px;justify-content:center}\n.tray:empty{display:none}\n.tray .pl.sel{border-color:#f59e0b;background:#fef3c7;box-shadow:0 0 0 4px #fde68a}\n.row{padding:10px 0;border-bottom:2px dashed #e2e8f0}\n.row:last-child{border-bottom:0}\n.stmt{font-size:26px;line-height:1.7;font-weight:700}\n.tf{display:flex;gap:12px;margin-top:6px}\n.tfb{font:800 25px \"Nunito\",system-ui,sans-serif;min-width:140px;min-height:56px;padding:6px 20px;border-radius:16px;border:3px solid #cbd5e1;background:#fff;cursor:pointer}\n.tfb:active{transform:scale(.96)}\n.tfb.bad{border-color:var(--red);background:#fee2e2}\n.tfb.good{border-color:var(--green);background:#dcfce7}\n.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}\n.opts .chip{text-align:left;font-size:25px}\n.sub{margin:0 0 16px;padding-bottom:14px;border-bottom:2px dashed #e2e8f0}\n.sub:last-child{border-bottom:0}\n.emo{font-size:46px;line-height:1}\n.final{display:none;text-align:center;font-size:30px;padding:24px;background:#fef3c7;border-radius:22px;margin-bottom:22px;font-weight:800}\n.final.show{display:block}\n.restart{font:800 24px \"Nunito\",system-ui,sans-serif;margin-top:12px;padding:10px 26px;border-radius:16px;border:3px solid var(--teal);background:#fff;color:var(--teal);cursor:pointer}\n@media (max-width:760px){.cols{grid-template-columns:1fr}}\n@media (max-width:640px){.match{gap:10px}.match::before{content:\"Touch one on the left, then its match on the right.\";grid-column:1/-1;font-size:18px;color:#64748b;text-align:center;line-height:1.6}.mcol{gap:10px}.itm{font-size:21px;padding:12px 8px}.itm.big{font-size:32px}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<h1 id=\"title\">English revision<\/h1>\n<div id=\"cards\"><\/div>\n<div class=\"final\" id=\"final\"><div id=\"finalMsg\"><\/div><button class=\"restart\" id=\"restart\">Start again<\/button><\/div>\n<\/div>\n<script>\nwindow.__noFb=true;\nconst BADGE=['#0f766e','#c2410c','#6d28d9','#1d4ed8','#be185d','#15803d'];\nconst LCOL=['#be185d','#6d28d9','#1d4ed8','#c2410c','#0f766e','#a16207','#15803d','#0369a1'];\nconst T=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\nconst shake=el=>{try{el.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:250});}catch(e){}};\nconst BAD='No, try again.';\nconst OKM='Well done!';\nconst BADM='Not quite. Touch the red ones to remove them, then try again.';\nfunction setFb(fb,cls,text){fb.className='fb '+cls;fb.textContent=text;}\nconst LOGE=(body,a,sg,l)=>{if(window.__logErr)window.__logErr(body,a,sg,l);};\n\n/* ---------- match ---------- */\nfunction buildMatch(body,pairs,done,bigLeft){\n  const n=pairs.length;\n  const A=pairs.map((p,i)=>({t:p[0],i,l:p[2]})),B=shuffle(pairs.map((p,i)=>({t:p[1],i})));\n  let links=[],selA=null,selB=null,fin=false;\n  const grid=T('div','match'),cA=T('div','mcol'),cB=T('div','mcol');grid.append(cA,cB);body.appendChild(grid);\n  const chk=T('button','chk','Check');body.appendChild(chk);const fb=T('div','fb');body.appendChild(fb);\n  const lk=(side,i)=>links.find(l=>l[side]===i);\n  function draw(){\n    cA.textContent='';cB.textContent='';\n    [[A,cA,'a',selA],[B,cB,'b',selB]].forEach(([arr,col,side,sel])=>arr.forEach(it=>{\n      const b=T('button','itm'+(bigLeft&&side==='a'?' big':''),it.t);const l=lk(side,it.i);\n      if(l){b.classList.add('lk');b.style.borderColor=LCOL[l.c];b.style.background=LCOL[l.c]+'22';if(l.s)b.classList.add(l.s);}\n      else if(sel===it.i)b.classList.add('sel');\n      b.onclick=()=>{\n        if(fin)return;\n        const x=lk(side,it.i);\n        if(x){links=links.filter(y=>y!==x);fb.className='fb';}\n        else{if(side==='a')selA=(selA===it.i?null:it.i);else selB=(selB===it.i?null:it.i);\n          if(selA!==null&&selB!==null){const used=links.map(y=>y.c);let c=0;while(used.includes(c))c++;links.push({a:selA,b:selB,c,s:''});selA=null;selB=null;}}\n        draw();};\n      col.appendChild(b);}));\n  }\n  chk.onclick=()=>{\n    if(links.length<n){setFb(fb,'bad','Match all of them first.');return;}\n    let bad=0;links.forEach(l=>{if(l.s==='ok')return;if(l.a===l.b)l.s='ok';else{if(l.s!=='bad')LOGE(body,A[l.a].t+' ↔ '+B.find(x=>x.i===l.b).t,'',A[l.a].l);l.s='bad';bad++;}});\n    draw();\n    if(bad)setFb(fb,'bad','Some links are wrong. Touch them to remove them, then try again.');\n    else{fin=true;chk.disabled=true;setFb(fb,'good',OKM);done();}\n  };\n  draw();\n}\n\n/* ---------- fill (word / letter bank) ---------- */\nfunction buildFill(body,tpl,ans,bank,lt,done,small){\n  const parts=tpl.split('___');const nb=ans.length;\n  const chips=shuffle(bank.map((t,i)=>({t,id:i})));\n  const place=Array(nb).fill(null),st=Array(nb).fill('');\n  let armedC=null,armedB=null,fin=false;\n  const para=T('div','para'),tray=T('div','chips');body.append(para,tray);\n  const chk=T('button','chk','Check');body.appendChild(chk);const fb=T('div','fb');body.appendChild(fb);\n  const put=(c,b)=>{place[b]=c;st[b]='';armedC=null;armedB=null;fb.className='fb';draw();};\n  function draw(){\n    para.textContent='';\n    parts.forEach((p,i)=>{\n      p.split('\\n').forEach((s,k)=>{if(k)para.appendChild(document.createElement('br'));para.appendChild(document.createTextNode(s));});\n      if(i<nb){\n        const bl=document.createElement('button');bl.className='blank'+(small?' s':'');\n        if(place[i]!==null){bl.classList.add('filled');if(st[i])bl.classList.add(st[i]);bl.textContent=bank[place[i]];}\n        else if(armedB===i)bl.classList.add('armed');\n        else bl.innerHTML='&nbsp;';\n        bl.onclick=()=>{\n          if(fin||st[i]==='ok')return;\n          if(place[i]!==null){if(armedC!==null){put(armedC,i);}else{place[i]=null;st[i]='';fb.className='fb';draw();}}\n          else if(armedC!==null)put(armedC,i);\n          else{armedB=(armedB===i?null:i);draw();}\n        };\n        para.appendChild(bl);\n      }\n    });\n    tray.textContent='';\n    chips.forEach(c=>{\n      const b=T('button','chip',c.t);\n      if(place.includes(c.id))b.classList.add('used');\n      else if(armedC===c.id)b.classList.add('sel');\n      b.onclick=()=>{if(armedB!==null)put(c.id,armedB);else{armedC=(armedC===c.id?null:c.id);draw();}};\n      tray.appendChild(b);});\n  }\n  chk.onclick=()=>{\n    if(place.includes(null)){setFb(fb,'bad','Fill all the blanks first.');return;}\n    let bad=0;place.forEach((c,i)=>{if(st[i]==='ok')return;const a=Array.isArray(ans[i])?ans[i]:[ans[i]];\n      if(a.includes(bank[c]))st[i]='ok';\n      else{if(st[i]!=='bad')LOGE(body,bank[c],parts[i].slice(-120)+' ___ '+(parts[i+1]||'').slice(0,50),lt);st[i]='bad';bad++;}});\n    draw();\n    if(bad)setFb(fb,'bad',BADM);\n    else{fin=true;chk.disabled=true;setFb(fb,'good',OKM);done();}\n  };\n  draw();\n}\n\n/* several fill exercises in one card */\nfunction buildMulti(body,list,done){\n  let left=list.length;\n  list.forEach(x=>{const s=T('div','sub');body.appendChild(s);buildFill(s,x.tpl,x.ans,x.bank,x.lt,()=>{if(--left===0)done();},x.small);});\n}\n\n/* ---------- classify ---------- */\nfunction buildClassify(body,cols,items,done){\n  const pos=items.map(()=>-1),st=items.map(()=>'');const order=shuffle(items.map((_,i)=>i));\n  let armed=null,fin=false;\n  const tray=T('div','tray'),grid=T('div','cols');grid.style.setProperty('--n',cols.length);body.append(tray,grid);\n  const chk=T('button','chk','Check');body.appendChild(chk);const fb=T('div','fb');body.appendChild(fb);\n  function draw(){\n    tray.textContent='';grid.textContent='';\n    order.forEach(i=>{if(pos[i]!==-1)return;const b=T('button','pl',items[i].t);if(armed===i)b.classList.add('sel');\n      b.onclick=()=>{armed=(armed===i?null:i);draw();};tray.appendChild(b);});\n    cols.forEach((c,ci)=>{\n      const col=T('div','col k'+ci);if(armed!==null)col.classList.add('armed');\n      col.appendChild(T('div','hd',c));const bd=T('div','bd');col.appendChild(bd);\n      order.forEach(i=>{if(pos[i]!==ci)return;const b=T('button','pl',items[i].t);if(st[i])b.classList.add(st[i]);\n        b.onclick=ev=>{ev.stopPropagation();if(fin||st[i]==='ok')return;pos[i]=-1;st[i]='';fb.className='fb';draw();};bd.appendChild(b);});\n      col.onclick=()=>{if(fin||armed===null)return;pos[armed]=ci;st[armed]='';armed=null;fb.className='fb';draw();};\n      grid.appendChild(col);});\n  }\n  chk.onclick=()=>{\n    if(pos.includes(-1)){setFb(fb,'bad','Put all the words in a column first.');return;}\n    let bad=0;items.forEach((it,i)=>{if(st[i]==='ok')return;if(pos[i]===it.c)st[i]='ok';else{if(st[i]!=='bad')LOGE(body,it.t,'',it.l);st[i]='bad';bad++;}});\n    draw();\n    if(bad)setFb(fb,'bad',BADM);\n    else{fin=true;chk.disabled=true;setFb(fb,'good',OKM);done();}\n  };\n  draw();\n}\n\n/* ---------- true / false ---------- */\nfunction buildTF(body,list,done){\n  let left=list.length;\n  list.forEach((s,i)=>{\n    const row=T('div','row');row.dataset.l=s.l||'';row.appendChild(T('div','stmt',(i+1)+') '+s.t));\n    const tf=T('div','tf');const fb=T('div','fb');\n    [['True ✔',true],['False ✘',false]].forEach(([lab,v])=>{\n      const b=T('button','tfb',lab);\n      b.onclick=()=>{\n        if(v!==s.v){b.classList.add('bad');shake(b);setFb(fb,'bad',BAD);return;}\n        tf.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add('good');\n        setFb(fb,'good',s.v?OKM:OKM+' '+s.fix);\n        if(--left===0)done();};\n      tf.appendChild(b);});\n    row.append(tf,fb);body.appendChild(row);});\n}\n\n/* ---------- multiple choice (first option = correct) ---------- */\nfunction buildQCM(body,list,done){\n  let left=list.length;\n  list.forEach((q,i)=>{\n    const row=T('div','row');row.dataset.l=q.l||'';row.appendChild(T('div','stmt',(i+1)+') '+q.q));\n    const o=T('div','opts');const fb=T('div','fb');\n    shuffle(q.o.map((t,k)=>({t,ok:k===0}))).forEach(x=>{\n      const b=T('button','chip',x.t);\n      b.onclick=()=>{\n        if(!x.ok){b.classList.add('bad');shake(b);setFb(fb,'bad',BAD);return;}\n        o.querySelectorAll('button').forEach(y=>y.disabled=true);b.classList.add('good');\n        setFb(fb,'good',OKM+(q.ex?' '+q.ex:''));\n        if(--left===0)done();};\n      o.appendChild(b);});\n    row.append(o,fb);body.appendChild(row);});\n}\n\n/* ---------- content ---------- */\nconst N='Numbers',J='Jobs',F='Family',C='Countries',I='is / are',Q='Questions and answers',P='Writing a paragraph',S='Sounds';\nconst L={N:'Anglais · '+N,J:'Anglais · '+J,F:'Anglais · '+F,C:'Anglais · '+C,I:'Anglais · '+I,Q:'Anglais · '+Q,P:'Anglais · '+P,S:'Anglais · '+S};\n\nconst DATA=[\n/* ===== NUMBERS ===== */\n {tag:N,ask:'I match the number with the word.',t:'match',big:true,pairs:[['11','eleven',L.N],['13','thirteen',L.N],['15','fifteen',L.N],['17','seventeen',L.N],['19','nineteen',L.N],['21','twenty-one',L.N],['25','twenty-five',L.N],['30','thirty',L.N]]},\n {tag:N,ask:'I put the missing letter to write the number.',t:'fill',lt:L.N,small:true,\n  tpl:'5 → f___ve\\n7 → s___ven\\n11 → e___even\\n14 → four___een\\n18 → eigh___een\\n28 → twenty-e___ght',\n  ans:['i','e','l','t','t','i'],bank:['i','e','l','t','t','i','a','o']},\n {tag:N,ask:'I choose the correct number.',t:'qcm',list:[\n  {q:'12 →',o:['twelve','twenty','two'],l:L.N},\n  {q:'13 →',o:['thirteen','thirty','three'],l:L.N},\n  {q:'20 →',o:['twenty','twelve','two'],l:L.N},\n  {q:'30 →',o:['thirty','thirteen','three'],l:L.N},\n  {q:'16 →',o:['sixteen','six','seventeen'],l:L.N},\n  {q:'18 →',o:['eighteen','eight','nineteen'],l:L.N}]},\n {tag:N,ask:'I put the numbers in order (from the smallest to the biggest).',t:'fill',lt:L.N,\n  tpl:'___  <  ___  <  ___  <  ___  <  ___',\n  ans:['twelve','fifteen','nineteen','twenty-three','twenty-nine'],bank:['twenty-nine','twelve','nineteen','fifteen','twenty-three']},\n {tag:N,ask:'I complete the numbers.',t:'multi',list:[\n  {tpl:'eleven, twelve, ___ , fourteen',ans:['thirteen'],bank:['thirteen','thirty','sixteen'],lt:L.N},\n  {tpl:'seventeen, eighteen, ___ , twenty',ans:['nineteen'],bank:['nineteen','nine','eleven'],lt:L.N},\n  {tpl:'twenty-four, ___ , twenty-six, twenty-seven',ans:['twenty-five'],bank:['twenty-five','fifteen','twenty-one'],lt:L.N},\n  {tpl:'twenty-eight, twenty-nine, ___',ans:['thirty'],bank:['thirty','thirteen','twenty'],lt:L.N}]},\n {tag:N,ask:'I complete with the age.',intro:'Omar is 10. His uncle Soufian is 30. His aunt Sara is 24. His cousins Nadjib and Nora are 11 and 13.',t:'fill',lt:L.N,\n  tpl:'Omar is ___ years old.\\nSoufian is ___ years old.\\nSara is ___ years old.\\nNadjib is ___ years old.\\nNora is ___ years old.',\n  ans:['ten','thirty','twenty-four','eleven','thirteen'],bank:['thirteen','ten','twenty-four','thirty','eleven','twenty','fourteen']},\n/* ===== JOBS ===== */\n {tag:J,ask:'I match the picture with the job.',t:'match',big:true,pairs:[['👩‍🏫','teacher',L.J],['🩺','doctor',L.J],['💉','nurse',L.J],['🦷','dentist',L.J],['🧑‍🌾','farmer',L.J],['👮','police officer',L.J],['🧑‍🚒','firefighter',L.J],['🚌','driver',L.J]]},\n {tag:J,ask:'I form the words (-er / -or / -ist).',t:'fill',lt:L.J,\n  tpl:'👩‍🏫  ___ + ___\\n🩺  ___ + ___\\n🧑‍🌾  ___ + ___\\n🦷  ___ + ___\\n🎒  ___ + ___',\n  ans:['teach','er','doc','tor','far','mer','den','tist','pu','pil'],bank:['teach','er','doc','tor','far','mer','den','tist','pu','pil'],small:true , he isn’t. He is a farmer.','Yes, he is.','No, he is a police officer.'],l:L.Q},\n  {q:'Soufian is Omar’s uncle. Is Soufian Omar’s father?',o:['No, he isn’t. He is Omar’s uncle.','Yes, he is.','No, he is Omar’s father.'],l:L.Q},\n  {q:'You are from Algeria. Are you Algerian?',o:['Yes, I am.','Yes, I is.','No, I am.'],l:L.Q},\n  {q:'Sara is 24. Is Sara 24?',o:['Yes, she is.','No, she isn’t.','Yes, he is.'],l:L.Q}]},\n/* ===== PARAGRAPH ===== */\n {tag:P,ask:'I read the text and write True or False.',intro:'Hello! My name is Adam. I am 9 years old. I am from Algeria. I am Algerian. I have one brother. My father is a teacher.',t:'tf',list:[\n  {t:'Adam is nine years old.',v:true,l:L.P},\n  {t:'Adam is from France.',v:false,fix:'Adam is from Algeria.',l:L.P},\n  {t:'Adam is Algerian.',v:true,l:L.P},\n  {t:'Adam has two brothers.',v:false,fix:'Adam has one brother.',l:L.P},\n  {t:'Adam’s father is a doctor.',v:false,fix:'Adam’s father is a teacher.',l:L.P}]},\n {tag:P,ask:'I complete the text from the table.',intro:'Name: Ines · sister · 27 · dentist.   Name: Walid · brother · 30 · journalist.',t:'fill',lt:L.P,\n  tpl:'My ___ Ines is ___ years old. She is a ___ .\\nMy ___ Walid is a ___ . He is ___ years old.',\n  ans:['sister','27','dentist','brother','journalist','30'],bank:['journalist','27','brother','30','sister','dentist','23']},\n {tag:P,ask:'I put the words in order.',t:'multi',list:[\n  {tpl:'___ ___ ___ ___ ___ ___',ans:['My','uncle','is','a','teacher','.'],bank:['uncle','My','.','is','a','teacher'],lt:L.P,small:true},\n  {tpl:'___ ___ ___ ___ ___ ___',ans:['I','am','nine','years','old','.'],bank:['nine','I','years','.','am','old'],lt:L.P,small:true},\n  {tpl:'___ ___ ___ ___ ___',ans:['She','is','my','mother','.'],bank:['mother','She','.','my','is'],lt:L.P,small:true}]},\n {tag:P,ask:'I choose the sentence that is written correctly.',t:'qcm',list:[\n  {q:'omar is an algerian pupil',o:['Omar is an Algerian pupil.','omar is an algerian pupil.','Omar is an algerian pupil'],l:L.P},\n  {q:'my name is karima',o:['My name is Karima.','my name is Karima.','My name is karima'],l:L.P},\n  {q:'i am from algeria',o:['I am from Algeria.','i am from Algeria.','I am from algeria.'],l:L.P}]},\n/* ===== SOUNDS ===== */\n {tag:S,ask:'I put each word in the right column.',t:'cls',cols:['short /i/ (i)','long /i:/ (ee, ea, ie)'],items:[\n  {t:'sit',c:0,l:L.S},{t:'big',c:0,l:L.S},{t:'fish',c:0,l:L.S},{t:'sister',c:0,l:L.S},{t:'six',c:0,l:L.S},\n  {t:'sleep',c:1,l:L.S},{t:'three',c:1,l:L.S},{t:'teacher',c:1,l:L.S},{t:'niece',c:1,l:L.S},{t:'eat',c:1,l:L.S}]},\n {tag:S,ask:'I put each word in the right column: sh or ch.',t:'cls',cols:['sh','ch'],items:[\n  {t:'English',c:0,l:L.S},{t:'British',c:0,l:L.S},{t:'fish',c:0,l:L.S},{t:'she',c:0,l:L.S},\n  {t:'China',c:1,l:L.S},{t:'cheese',c:1,l:L.S},{t:'chicken',c:1,l:L.S},{t:'French',c:1,l:L.S}]},\n {tag:S,ask:'I complete with sh or ch.',t:'fill',lt:L.S,small:true,\n  tpl:'___ina\\nEngli___\\ntea___er\\nBrit___',\n  ans:['ch','sh','ch','sh'],bank:['ch','sh','ch','sh']}\n];\n\n/* ---------- assembly ---------- */\nlet doneSet=new Set();\nfunction start(){\n  doneSet=new Set();document.getElementById('final').classList.remove('show');\n  const host=document.getElementById('cards');host.textContent='';\n  DATA.forEach((d,i)=>{\n    const card=T('div','card');card.style.borderColor=BADGE[i%6]+'55';\n    const h=document.createElement('h2');const b=T('span','badge',String(i+1));b.style.background=BADGE[i%6];h.appendChild(b);h.appendChild(T('span','tag',d.tag));card.appendChild(h);\n    card.appendChild(T('div','ask',d.ask));\n    if(d.intro)card.appendChild(T('div','intro',d.intro));\n    const body=document.createElement('div');card.appendChild(body);host.appendChild(card);\n    const done=()=>{card.classList.add('done');doneSet.add(i);if(doneSet.size===DATA.length)finish();};\n    if(d.t==='match')buildMatch(body,d.pairs,done,d.big);\n    else if(d.t==='tf')buildTF(body,d.list,done);\n    else if(d.t==='    if(ghost){ghost.remove();ghost=null;}cur.el.style.opacity='';\n    if(cancel){supp=true;setTimeout(()=>{supp=false;},80);return;}\n    const t=document.elementFromPoint(e.clientX,e.clientY);const tg=t&&t.closest&&t.closest(TGT);\n    if(tg&&tg!==cur.el){\n      cur.el.dispatchEvent(new MouseEvent('click',{bubbles:true}));\n      const again=document.elementFromPoint(e.clientX,e.clientY);const t2=(again&&again.closest&&again.closest(TGT))||tg;\n      t2.dispatchEvent(new MouseEvent('click',{bubbles:true}));\n    }\n    supp=true;setTimeout(()=>{supp=false;},80);\n  }\n  document.addEventListener('pointerup',e=>end(e,false),true);\n  document.addEventListener('pointercancel',e=>end(e,true),true);\n  document.addEventListener('click',e=>{if(supp){e.stopPropagation();e.preventDefault();}},true);\n  const st=document.createElement('style');\n  st.textContent='.chips .chip,.tray .pl{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}';document.head.appendChild(st);\n})();\n<\/script>\n<\/body>\n<\/html>\n"

function openExo(e){state='fr';$('ttl').textContent=e.ar;logOpen(e.k);const s=SRC[e.k],i=s.lastIndexOf('</body>');const P=(['isl','gh','hi','en'].includes(e.k)?PRG(e.k):'')+(e.k==='en'?'':'<style>@media (max-width:640px){.match{grid-template-columns:1fr 1fr!important;gap:10px!important}.match::before{content:"اِلْمَسْ عُنْصُرًا مِنَ اليَمِينِ، ثُمَّ مَا يُنَاسِبُهُ مِنَ اليَسَارِ.";grid-column:1/-1;font-size:18px;color:#64748b;text-align:center;line-height:1.8}.mcol{gap:10px}.itm{font-size:21px!important;padding:12px 8px!important;min-height:64px;line-height:1.7}}</style>');$('fr').srcdoc=i<0?s+TRK(e.k)+P:s.slice(0,i)+TRK(e.k)+P+s.slice(i);setScreen('fr');}
$('back').onclick=()=>{if(state==='fr'){$('fr').srcdoc='';openSubj(cur);}else{state='home';$('ttl').textContent='Révisions ikhtibarat';$('back').style.display='none';setScreen('home');}};
/* ---------- suivi des erreurs (compte rendu) ---------- */
const LKEY='ilyasLogV1';let LOG=[];
try{LOG=JSON.parse(localStorage.getItem(LKEY)||'[]');if(!Array.isArray(LOG))LOG=[];}catch(e){LOG=[];}
function saveLog(){if(LOG.length>3000)LOG=LOG.slice(-3000);try{localStorage.setItem(LKEY,JSON.stringify(LOG));}catch(e){}}
function trackerFn(K){
  const post=o=>{try{parent.postMessage(Object.assign({ilyasLog:1,ex:K},o),'*');}catch(e){}};
  const tx=(e,n)=>((e&&e.textContent)||'').replace(/\s+/g,' ').trim().slice(0,n||100);
  const cardOf=el=>el.closest('.card,section.card');
  const isBad=el=>el.classList&&(el.classList.contains('bad')||el.classList.contains('no'));
  const wasBad=v=>/(^|\s)(bad|no)(\s|$)/.test(v||'');
  const lastEl=new Map();
  function seg(el){let s='',n=el.previousSibling;while(n&&!(n.classList&&n.classList.contains('blank'))){s=tx(n,200)+' '+s;n=n.previousSibling;}
    n=el.nextSibling;while(n&&!(n.classList&&n.classList.contains('blank'))){s+=' '+tx(n,200);n=n.nextSibling;}return s.slice(0,260);}
  function info(el,fb){
    const card=cardOf(el);const lq=el.closest&&el.closest('[data-l]');const o={l:lq?lq.dataset.l:'',card:card&&card.querySelector('.badge')?tx(card.querySelector('.badge'),4):'',q:'',a:fb?'':tx(el,70),seg:'',h:'',ask:''};
    const row=el.closest('.row'),qb=el.closest('.qb');
    if(row)o.q=tx(row.querySelector('.stmt'),140);
    else if(qb)o.q=tx(qb.querySelector('.ask'),140);
    if(el.classList.contains('blank'))o.seg=seg(el);
    if(card){const hs=[...card.querySelectorAll('.col .hd')].map(h=>tx(h,60)).join(' | ');o.h=hs;
      o.ask=tx(card.querySelector('.ask'),100)+' '+tx(card.querySelector('.intro,.txt'),160);
      if(!o.q&&!o.seg&&!o.h&&!o.ask.trim())o.ask=tx(card,120);}
    return o;}
  window.__logErr=(el,a,sg,l)=>{const o=info(el,true);o.a=a||'';o.seg=sg||'';if(l)o.l=l;post(o);};
  new MutationObserver(ms=>{
    const now=Date.now(),batchCards=new Set(),fbs=[];
    for(const m of ms){
      if(m.attributeName!=='class')continue;const el=m.target;if(!isBad(el))continue;
      if(el.classList.contains('fb')){fbs.push(el);continue;}
      if(wasBad(m.oldValue))continue;
      const c=cardOf(el)||document.body;batchCards.add(c);lastEl.set(c,now);post(info(el,false));
    }
    fbs.forEach(el=>{if(window.__noFb)return;const c=cardOf(el)||document.body;if(batchCards.has(c))return;if(now-(lastEl.get(c)||0)<1000)return;post(info(el,true));});
  }).observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class'],attributeOldValue:true});
}
const progFn=function(K){
  let S={};const sess=new WeakSet();
  const host=document.getElementById('cards');if(!host)return;
  const bar=document.createElement('div');bar.id='prog';
  bar.style.cssText='background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(0,0,0,.08);padding:10px 14px;margin:0 0 18px;direction:ltr;font-family:system-ui,sans-serif';
  host.parentNode.insertBefore(bar,host);
  const fd=t=>{const d=new Date(t);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');};
  const cards=()=>[...host.children].filter(c=>c.classList.contains('card'));
  function render(){
    const cs=cards();let nd=0;cs.forEach((c,i)=>{if(S[i])nd++;});
    bar.textContent='';
    const top=document.createElement('div');top.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px';
    const a=document.createElement('b');a.textContent='Tes exercices';a.style.fontSize='17px';
    const b=document.createElement('span');b.textContent=nd+' faits sur '+cs.length;b.style.cssText='font-size:15px;color:#6b7280';
    top.append(a,b);bar.appendChild(top);
    const row=document.createElement('div');row.style.cssText='display:flex;flex-wrap:wrap;gap:8px';
    cs.forEach((c,i)=>{
      const d=document.createElement('button');d.type='button';d.setAttribute('aria-label','Exercice '+(i+1));
      const ok=!!S[i];
      d.style.cssText='width:38px;height:38px;border-radius:50%;font:700 16px system-ui,sans-serif;cursor:pointer;border:2px solid '+(ok?'#3B6D11':'#cbd5e1')+';background:'+(ok?'#3B6D11':'#f8fafc')+';color:'+(ok?'#fff':'#334155');
      d.textContent=ok?'✓':String(i+1);
      d.onclick=()=>c.scrollIntoView({behavior:'smooth',block:'start'});
      row.appendChild(d);
      const h2=c.querySelector('h2');
      let tg=c.querySelector('.dtag');
      if(ok&&h2){if(!tg){tg=document.createElement('span');tg.className='dtag';tg.style.cssText='display:inline-block;vertical-align:middle;margin:0 12px;padding:3px 12px;border-radius:10px;background:#dcfce7;color:#14532d;font:600 15px/1.6 system-ui,sans-serif;direction:ltr';h2.appendChild(tg);}
        tg.textContent='✓ Déjà fait le '+fd(S[i].t)+(S[i].n>1?' ('+S[i].n+' fois)':'');}
      else if(tg)tg.remove();
    });
    bar.appendChild(row);
  }
  function check(){
    let ch=false;
    cards().forEach((c,i)=>{if(c.classList.contains('done')&&!sess.has(c)){sess.add(c);const o=S[i]||{n:0};S[i]={t:Date.now(),n:o.n+1};ch=true;
      try{parent.postMessage({ilyasDone:1,ex:K,i:i,t:Date.now()},'*');}catch(e){}}});
    render();
  }
  let q=0;const sched=()=>{if(q)return;q=1;setTimeout(()=>{q=0;check();},40);};
  new MutationObserver(sched).observe(host,{attributes:true,attributeFilter:['class'],childList:true,subtree:true});
  window.addEventListener('message',ev=>{const d=ev.data;if(d&&d.ilyasState){S=d.ilyasState||{};render();}});
  render();
  try{parent.postMessage({ilyasReady:1,ex:K},'*');}catch(e){}
};
const PRG=k=>'<script>('+progFn.toString()+')('+JSON.stringify(k)+')<\/script>';
const TRK=k=>'<script>('+trackerFn.toString()+')('+JSON.stringify(k)+')<\/script>';
const nrm=s=>(s||'').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي');
const LES=[['livres','Les livres célestes',/صحف|زبور|توراة|انجيل|قران|كتب|كتاب|سماوي|انزل|سيدنا/],
 ['zakat','La zakât',/زكا|نصاب|حول|فقراء|اغنياء|سنة/],
 ['voisin','Le bien envers le voisin',/جار|جبريل|سيورث/],
 ['ikhlas','Ikhlâs et riyâ\'',/اخلاص|رياء|مخلص|حنفاء|اختاروا|خالص|مدح|تظاهر|تفاخر|تصدق|وفاء|اتقان|ارضاء|خشية|وعد/],
 ['ibad','Serviteurs du Tout-Miséricordieux',/عباد(?!ة)|رحمن|هونا|جاهل|تكبر|سامح|يؤذ|تواضع|سكينة|فخر|اصدقاء/],
 ['ilm','La recherche du savoir',/علم|فريضة|تعلم|جهل|مجتهد|تلميذ|معلم|اجتهد/]];
function lesson(e){for(const f of [e.q,e.seg,e.h,e.a,e.ask]){const t=nrm(f);if(!t)continue;for(const l of LES)if(l[2].test(t))return l[1];}return 'Vocabulaire / autre';}
const EXN={};SUBJ.forEach(s=>s.ex.forEach(x=>{EXN[x.k]={subj:s.fr,fr:x.fr,ar:x.ar};}));
window.addEventListener('message',ev=>{
  const d=ev.data;if(!d||!d.ilyasLog||ev.source!==$('fr').contentWindow)return;
  const last=LOG[LOG.length-1],now=Date.now();
  const e={t:now,ex:d.ex,l:d.l||'',card:d.card||'',q:d.q||'',a:d.a||'',seg:d.seg||'',h:d.h||'',ask:d.ask||''};
  if(last&&last.ex===e.ex&&last.card===e.card&&last.q===e.q&&last.a===e.a&&now-last.t<300)return;
  LOG.push(e);saveLog();
});
function logOpen(k){LOG.push({t:Date.now(),ex:k,open:1});saveLog();}
const fdate=t=>{const d=new Date(t);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});};
let repRange=7,confirmDel=false,confirmRs=false,repSubj=null;
let DONE={};try{DONE=JSON.parse(localStorage.getItem('ilyasDoneV1')||'{}');}catch(e){}
function saveDone(){try{localStorage.setItem('ilyasDoneV1',JSON.stringify(DONE));}catch(e){}}
window.addEventListener('message',ev=>{const d=ev.data;if(!d||ev.source!==$('fr').contentWindow)return;
  if(d.ilyasReady){try{ev.source.postMessage({ilyasState:DONE[d.ex]||{}},'*');}catch(e){}}
  else if(d.ilyasDone){const s=DONE[d.ex]=DONE[d.ex]||{};const o=s[d.i]||{n:0};s[d.i]={t:d.t,n:o.n+1};saveDone();}
});
const grp=e=>e.l?e.l:e.ex==='isl'?lesson(e):((EXN[e.ex]||{fr:e.ex}).fr);
function renderRep(){
  const host=$('rep');host.textContent='';const w=document.createElement('div');w.className='rw';host.appendChild(w);
  const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n;};
  const subs=SUBJ.filter(s=>s.ex.length).map(s=>s.fr);
  if(!repSubj||!subs.includes(repSubj))repSubj=subs[0];
  const since=repRange?Date.now()-repRange*864e5:0;
  const ev=LOG.filter(e=>e.t>=since&&((EXN[e.ex]||{}).subj===repSubj));
  const errs=ev.filter(e=>!e.open),opens=ev.filter(e=>e.open);
  const a1=el('div','acts');
  subs.forEach(s=>{const n=LOG.filter(e=>e.t>=since&&!e.open&&(EXN[e.ex]||{}).subj===s).length;const b=el('button','b'+(repSubj===s?' on':''),s+' ('+n+')');b.onclick=()=>{repSubj=s;confirmDel=false;renderRep();};a1.appendChild(b);});
  w.appendChild(a1);
  const a2=el('div','acts');
  [[7,'7 derniers jours'],[0,'Tout']].forEach(([r,l])=>{const b=el('button','b'+(repRange===r?' on':''),l);b.onclick=()=>{repRange=r;renderRep();};a2.appendChild(b);});
  w.appendChild(a2);
  const sum=el('div','sum');
  [[errs.length,'erreurs'],[opens.length,'exercices ouverts'],[ev.length?fdate(ev[ev.length-1].t):'—','dernière activité']].forEach(([n,l])=>{const k=el('div','kpi');const b=el('b',null,String(n));if(typeof n==='string')b.style.fontSize='22px';k.append(b,el('span',null,l));sum.appendChild(k);});
  w.appendChild(sum);
  const lines=['Compte rendu d\'Ilyas — '+repSubj+' ('+(repRange?repRange+' derniers jours':'tout')+') : '+errs.length+' erreurs, '+opens.length+' exercices ouverts.'];
  if(!errs.length){w.appendChild(el('div','box','Aucune erreur enregistrée en '+repSubj+' sur cette période.'));}
  else{
    const g={};errs.forEach(e=>{(g[grp(e)]=g[grp(e)]||[]).push(e);});
    const order=Object.entries(g).sort((a,b)=>b[1].length-a[1].length),mx=order[0][1].length;
    w.appendChild(el('h2',null,'À revoir en priorité'));
    const bx=el('div','box');order.forEach(([k,l])=>{const r=el('div','bar');r.appendChild(el('div','n',k));const t=el('div','t'),i=el('i');i.style.width=Math.max(6,l.length/mx*100)+'%';t.appendChild(i);r.appendChild(t);r.appendChild(el('div','c',String(l.length)));bx.appendChild(r);});
    w.appendChild(bx);
    w.appendChild(el('h2',null,'Détail par '+(repSubj==='Maths'?'exercice':'leçon')));
    order.forEach(([k,l],gi)=>{
      const d=document.createElement('details');d.className='box';if(gi===0)d.open=true;
      d.appendChild(el('summary',null,k+' — '+l.length+' erreur'+(l.length>1?'s':'')));
      l.slice(-12).reverse().forEach(e=>{const r=el('div','ev');r.appendChild(el('small',null,fdate(e.t)+(e.card?' · n°'+e.card:'')));
        const qq=e.q||e.seg||e.ask||'';if(qq)r.appendChild(el('div','ar',qq));
        if(e.a){const x=el('div',null,'Sa réponse : ');x.appendChild(el('span','ar',e.a));r.appendChild(x);}
        d.appendChild(r);});
      w.appendChild(d);
      lines.push('- '+k+' : '+l.length);
      l.slice(-5).forEach(e=>lines.push('    · '+(e.card?'n°'+e.card+' ':'')+(e.q||e.seg||e.ask)+' | réponse : '+e.a));
    });
  }
  const txt=lines.join('\n');
  w.appendChild(el('h2',null,'Résumé'));
  const ta=el('textarea');ta.readOnly=true;ta.value=txt;w.appendChild(ta);
  const a3=el('div','acts');const cp=el('button','b','Copier le résumé');cp.onclick=()=>{ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(x){}try{if(!ok&&navigator.clipboard)navigator.clipboard.writeText(txt);}catch(x){}cp.textContent='Copié ✔ (ou sélectionné)';};a3.appendChild(cp);
  const del=el('button','b red',confirmDel?'Confirmer : tout effacer':'Effacer tout l\'historique');del.onclick=()=>{if(!confirmDel){confirmDel=true;renderRep();return;}LOG=[];saveLog();confirmDel=false;renderRep();};a3.appendChild(del);
  const rs=el('button','b',confirmRs?'Confirmer : remettre à zéro':'Remettre les exercices à zéro (coches « fait »)');rs.onclick=()=>{if(!confirmRs){confirmRs=true;renderRep();return;}DONE={};saveDone();confirmRs=false;renderRep();};a3.appendChild(rs);
  w.appendChild(a3);
}
function openRep(){state='rep';$('ttl').textContent='Compte rendu';$('back').style.display='block';confirmDel=false;confirmRs=false;renderRep();setScreen('rep');}
(function(){const b=$('repbtn');let tm=null;
  const stop=()=>{clearTimeout(tm);b.classList.remove('hold');};
  b.addEventListener('pointerdown',e=>{b.classList.add('hold');tm=setTimeout(()=>{stop();openRep();},1200);});
  ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,stop));
  b.addEventListener('contextmenu',e=>e.preventDefault());})();
