',list:[\n  {q:'مِنْ فَوَائِدِ الزَّكَاةِ:',o:['تُبَارِكُ فِي المَالِ وَتَنْشُرُ المَحَبَّةَ وَالتَّعَاوُنَ بَيْنَ النَّاسِ','تُنْقِصُ المَالَ','تَجْعَلُنَا نَتَكَبَّرُ']},\n  {q:'مِنْ فَوَائِدِ العِلْمِ:',o:['يُسَاعِدُنَا عَلَى مَعْرِفَةِ الخَيْرِ مِنَ الشَّرِّ وَالحَقِّ مِنَ البَاطِلِ','يَجْعَلُنَا نَجْمَعُ المَالَ','يَجْعَلُنَا نَتَكَبَّرُ']},\n  {q:'مَاذَا يَقْبَلُ اللهُ مِنَ الأَعْمَالِ؟',o:['مَا كَانَ خَالِصًا لَهُ','مَا رَآهُ النَّاسُ','مَا مَدَحَنَا عَلَيْهِ النَّاسُ']},\n  {q:'مَنِ التِّلْمِيذُ الَّذِي يُحِبُّهُ اللهُ وَالنَّاسُ؟',o:['المُجْتَهِدُ الَّذِي يَحْتَرِمُ مُعَلِّمَهُ','الَّذِي يَتَكَبَّرُ عَلَى أَصْدِقَائِهِ','الَّذِي لَا يَدْرُسُ']},\n  {q:'مِنْ مَظَاهِرِ الإِخْلَاصِ:',o:['الوَفَاءُ بِالوَعْدِ وَالخَشْيَةُ مِنَ اللهِ وَإِتْقَانُ العَمَلِ','التَّصَدُّقُ أَمَامَ النَّاسِ لِلتَّفَاخُرِ','إِظْهَارُ الأَعْمَالِ لِيَمْدَحَنَا النَّاسُ']}]},\n {ask:'أَكْمِلْ بِمَا يُنَاسِبُ.',t:'fill',\n  tpl:'عِبَادُ الرَّحْمَنِ يَمْشُونَ عَلَى الأَرْضِ ___ أَيْ بِتَوَاضُعٍ. وَإِذَا خَاطَبَهُمُ الجَاهِلُونَ ___ سَلَامًا. وَنَبْتَعِدُ عَنِ ___ وَالفَخْرِ أَمَامَ الأَصْدِقَاءِ. وَطَلَبُ العِلْمِ ___ عَلَى كُلِّ مُسْلِمٍ، وَالعِلْمُ يَحْمِينَا مِنَ ___.',\n  bank:['هَوْنًا','قَالُوا','التَّكَبُّرِ','فَرِيضَةٌ','الجَهْلِ','سَرِيعًا','الأَدَبِ']},\n {ask:'اِرْبِطْ كُلَّ اسْمٍ بِمَا يُنَاسِبُهُ.',t:'match',pairs:[\n  ['خَدِيجَةُ رَضِيَ اللهُ عَنْهَا','أَوَّلُ مَنْ آمَنَ بِهِ مِنَ النِّسَاءِ'],\n  ['أَبُو بَكْرٍ الصِّدِّيقُ رَضِيَ اللهُ عَنْهُ','أَوَّلُ مَنْ آمَنَ بِهِ مِنَ الرِّجَالِ'],\n  ['عَلِيُّ بْنُ أَبِي طَالِبٍ رَضِيَ اللهُ عَنْهُ','أَوَّلُ مَنْ آمَنَ بِهِ مِنَ الصِّبْيَانِ'],\n  ['المَلَكُ جِبْرِيلُ عَلَيْهِ السَّلَامُ','نَزَلَ عَلَى النَّبِيِّ ﷺ بِأَوَّلِ آيَاتِ القُرْآنِ الكَرِيمِ']]},\n {ask:'صَحِيحٌ أَمْ خَطَأٌ؟',t:'tf',list:[\n  {t:'بَلَغَ النَّبِيُّ مُحَمَّدٌ ﷺ سِنَّ الأَرْبَعِينَ عِنْدَمَا نَزَلَ عَلَيْهِ الوَحْيُ.',v:true},\n  {t:'نَزَلَ المَلَكُ جِبْرِيلُ عَلَيْهِ السَّلَامُ بِأَوَّلِ آيَاتِ القُرْآنِ الكَرِيمِ.',v:true},\n  {t:'عُمْرُ النَّبِيِّ ﷺ عِنْدَ بَدْءِ الوَحْيِ ثَلَاثُونَ سَنَةً.',v:false,fix:'عُمْرُ النَّبِيِّ ﷺ عِنْدَ بَدْءِ الوَحْيِ أَرْبَعُونَ سَنَةً.'},\n  {t:'أَبُو بَكْرٍ الصِّدِّيقُ هُوَ أَوَّلُ مَنْ آمَنَ بِهِ مِنَ النِّسَاءِ.',v:false,fix:'خَدِيجَةُ هِيَ أَوَّلُ مَنْ آمَنَ بِهِ مِنَ النِّسَاءِ، وَأَبُو بَكْرٍ أَوَّلُ مَنْ آمَنَ بِهِ مِنَ الرِّجَالِ.'},\n  {t:'عَلِيُّ بْنُ أَبِي طَالِبٍ أَوَّلُ مَنْ آمَنَ بِهِ مِنَ الصِّبْيَانِ.',v:true},\n  {t:'دَعَا النَّبِيُّ ﷺ قَوْمَهُ إِلَى الإِسْلَامِ سِرًّا لِمُدَّةِ خَمْسِ سَنَوَاتٍ.',v:false,fix:'دَعَا النَّبِيُّ ﷺ قَوْمَهُ إِلَى الإِسْلَامِ سِرًّا لِمُدَّةِ ثَلَاثِ سَنَوَاتٍ.'},\n  {t:'جَهَرَ النَّبِيُّ ﷺ بِالدَّعْوَةِ إِلَى الإِسْلَامِ بَعْدَ مَرْحَلَةِ الدَّعْوَةِ سِرًّا.',v:true}]},\n {ask:'أَكْمِلْ بِمَا يُنَاسِبُ.',t:'fill',\n  tpl:'بَلَغَ النَّبِيُّ مُحَمَّدٌ ﷺ سِنَّ ___ ، فَنَزَلَ عَلَيْهِ المَلَكُ ___ عَلَيْهِ السَّلَامُ بِأَوَّلِ آيَاتِ ___ الكَرِيمِ.',\n  ans:['الأَرْبَعِينَ','جِبْرِيلُ','القُرْآنِ'],\n  bank:['الأَرْبَعِينَ','جِبْرِيلُ','القُرْآنِ','الثَّلَاثِينَ','مِيكَائِيلُ','التَّوْرَاةِ']},\n {ask:'صَنِّفِ الجُمَلَ فِي الجَدْوَلِ.',t:'cls',cols:['المَرْحَلَةُ الأُولَى: الدَّعْوَةُ سِرًّا','المَرْحَلَةُ الثَّانِيَةُ: الدَّعْوَةُ جَهْرًا'],items:[\n  {t:'دَعَا النَّبِيُّ ﷺ قَوْمَهُ إِلَى الإِسْلَامِ سِرًّا.',c:0},\n  {t:'دَامَتْ ثَلَاثَ سَنَوَاتٍ.',c:0},\n  {t:'هِيَ المَرْحَلَةُ الأُولَى.',c:0},\n  {t:'جَهَرَ النَّبِيُّ ﷺ بِالدَّعْوَةِ إِلَى الإِسْلَامِ.',c:1},\n  {t:'جَاءَتْ بَعْدَ مَرْحَلَةِ الدَّعْوَةِ سِرًّا.',c:1},\n  {t:'هِيَ المَرْحَلَةُ الثَّانِيَةُ.',c:1}]},\n {ask:'اِخْتَرِ الجَوَابَ الصَّحِيحَ.',t:'qcm',list:[\n  {q:'كَمْ كَانَ عُمْرُ النَّبِيِّ ﷺ عِنْدَ بَدْءِ الوَحْيِ؟',o:['أَرْبَعِينَ سَنَةً','ثَلَاثِينَ سَنَةً','سِتِّينَ سَنَةً']},\n  {q:'مَنِ المَلَكُ الَّذِي نَزَلَ عَلَى النَّبِيِّ ﷺ بِأَوَّلِ آيَاتِ القُرْآنِ؟',o:['جِبْرِيلُ عَلَيْهِ السَّلَامُ','مِيكَائِيلُ عَلَيْهِ السَّلَامُ','إِسْرَافِيلُ عَلَيْهِ السَّلَامُ']},\n  {q:'مَنْ هِيَ أَوَّلُ مَنْ آمَنَ بِالنَّبِيِّ ﷺ مِنَ النِّسَاءِ؟',o:['خَدِيجَةُ رَضِيَ اللهُ عَنْهَا','عَائِشَةُ رَضِيَ اللهُ عَنْهَا','فَاطِمَةُ رَضِيَ اللهُ عَنْهَا']},\n  {q:'مَنْ أَوَّلُ مَنْ آمَنَ بِالنَّبِيِّ ﷺ مِنَ الرِّجَالِ؟',o:['أَبُو بَكْرٍ الصِّدِّيقُ رَضِيَ اللهُ عَنْهُ','عَلِيُّ بْنُ أَبِي طَالِبٍ رَضِيَ اللهُ عَنْهُ','عُمَرُ بْنُ الخَطَّابِ رَضِيَ اللهُ عَنْهُ']},\n  {q:'مَنْ أَوَّلُ مَنْ آمَنَ بِالنَّبِيِّ ﷺ مِنَ الصِّبْيَانِ؟',o:['عَلِيُّ بْنُ أَبِي طَالِبٍ رَضِيَ اللهُ عَنْهُ','أَبُو بَكْرٍ الصِّدِّيقُ رَضِيَ اللهُ عَنْهُ','خَدِيجَةُ رَضِيَ اللهُ عَنْهَا']},\n  {q:'كَمْ دَامَتِ الدَّعْوَةُ سِرًّا؟',o:['ثَلَاثَ سَنَوَاتٍ','سَنَةً وَاحِدَةً','عَشْرَ سَنَوَاتٍ']}]},\n {ask:'اِرْبِطْ كُلَّ رَقْمٍ بِمَا يُنَاسِبُهُ.',t:'match',pairs:[\n  ['40 سَنَةً','عُمْرُ النَّبِيِّ ﷺ عِنْدَ بَدْءِ الوَحْيِ'],\n  ['3 سَنَوَاتٍ','مُدَّةُ الدَّعْوَةِ سِرًّا'],\n  ['2','عَدَدُ مَرْحَلَتَيِ الدَّعْوَةِ']]},\n {ask:'أَحْفَظُ وَأَتَذَكَّرُ: أَكْمِلْ بِمَا يُنَاسِبُ.',t:'fill',\n  tpl:'خَدِيجَةُ : أَوَّلُ ___ . أَبُو بَكْرٍ : أَوَّلُ ___ . عَلِيٌّ : أَوَّلُ ___ . ___ سَنَةً : عُمْرُ النَّبِيِّ ﷺ عِنْدَ بَدْءِ الوَحْيِ. 3 سَنَوَاتٍ : مُدَّةُ الدَّعْوَةِ ___ .',\n  ans:['امْرَأَةٍ','رَجُلٍ','صَبِيٍّ','40','سِرًّا'],\n  bank:['امْرَأَةٍ','رَجُلٍ','صَبِيٍّ','40','سِرًّا','جَهْرًا','30']},\n {ask:'الوَضْعِيَّةُ الإِدْمَاجِيَّةُ',t:'qcm',intro:'زَارَكُمْ جَارُكُمُ الجَدِيدُ سَعِيدٌ فِي البَيْتِ، فَأَخْبَرْتَهُ أَنَّكَ تَتَعَلَّمُ فِي المَدْرَسَةِ دَرْسَ الزَّكَاةِ وَدَرْسَ طَلَبِ العِلْمِ وَدَرْسَ الإِخْلَاصِ.',list:[\n  {q:'كَيْفَ تَسْتَقْبِلُ جَارَكَ؟',o:['أُسَلِّمُ عَلَيْهِ وَأَبْتَسِمُ فِي وَجْهِهِ','أَتَجَاهَلُهُ','أُزْعِجُهُ بِالصَّوْتِ العَالِي']},\n  {q:'مَتَى تَجِبُ الزَّكَاةُ فِي المَالِ؟',o:['إِذَا بَلَغَ المَالُ النِّصَابَ وَمَرَّتْ عَلَيْهِ سَنَةٌ كَامِلَةٌ','إِذَا كَانَ المَالُ قَلِيلًا','كُلَّ يَوْمٍ']},\n  {q:'اُذْكُرْ لَهُ فَائِدَةً لِلْعِلْمِ.',o:['يَحْمِينَا مِنَ الجَهْلِ كَيْ لَا يَخْدَعَنَا أَحَدٌ','يَجْعَلُنَا نَتَكَبَّرُ عَلَى النَّاسِ','يُنْقِصُ المَالَ']},\n  {q:'قَالَ سَعِيدٌ إِنَّهُ يُرِيدُ أَنْ يَتَصَدَّقَ أَمَامَ النَّاسِ لِيَمْدَحُوهُ. بِمَاذَا تَنْصَحُهُ؟',o:['نَعْمَلُ الخَيْرَ لِإِرْضَاءِ اللهِ فَقَطْ، فَالرِّيَاءُ مَمْنُوعٌ','نَتَصَدَّقُ أَمَامَ النَّاسِ حَتَّى يَرَوْنَا','لَا نَتَصَدَّقُ أَبَدًا']}]},\n\n {ask:'اِرْبِطْ كُلَّ نَبِيٍّ بِالكِتَابِ الَّذِي أُنْزِلَ عَلَيْهِ.',t:'match',pairs:[\n  ['سَيِّدُنَا مُوسَى عَلَيْهِ السَّلَامُ','التَّوْرَاةُ'],\n  ['سَيِّدُنَا عِيسَى عَلَيْهِ السَّلَامُ','الإِنْجِيلُ'],\n  ['سَيِّدُنَا دَاوُودُ عَلَيْهِ السَّلَامُ','الزَّبُورُ'],\n  ['سَيِّدُنَا إِبْرَاهِيمُ عَلَيْهِ السَّلَامُ','الصُّحُفُ'],\n  ['سَيِّدُنَا مُحَمَّدٌ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ','القُرْآنُ الكَرِيمُ']]},\n {ask:'صَحِيحٌ أَمْ خَطَأٌ؟',t:'tf',list:[\n  {t:'أُنْزِلَتِ التَّوْرَاةُ عَلَى سَيِّدِنَا مُوسَى عَلَيْهِ السَّلَامُ.',v:true},\n  {t:'الزَّكَاةُ هِيَ الرُّكْنُ الأَوَّلُ مِنْ أَرْكَانِ الإِسْلَامِ.',v:false,fix:'الزَّكَاةُ هِيَ الرُّكْنُ الثَّالِثُ مِنْ أَرْكَانِ الإِسْلَامِ.'},\n  {t:'نُحْسِنُ إِلَى الجَارِ وَنُسَاعِدُهُ إِذَا احْتَاجَ.',v:true},\n  {t:'أُنْزِلَ الزَّبُورُ عَلَى سَيِّدِنَا عِيسَى عَلَيْهِ السَّلَامُ.',v:false,fix:'أُنْزِلَ الزَّبُورُ عَلَى سَيِّدِنَا دَاوُودَ عَلَيْهِ السَّلَامُ.'},\n  {t:'الإِخْلَاصُ هُوَ العَمَلُ لِإِرْضَاءِ اللهِ فَقَطْ.',v:true},\n  {t:'طَلَبُ العِلْمِ لَيْسَ وَاجِبًا عَلَى المُسْلِمِ.',v:false,fix:'طَلَبُ العِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ.'},\n  {t:'الزَّكَاةُ تُبَارِكُ فِي المَالِ.',v:true},\n  {t:'قِيمَةُ الوَلَدِ فِي عِلْمِهِ وَأَخْلَاقِهِ.',v:true},\n  {t:'عِبَادُ الرَّحْمَنِ يَرُدُّونَ عَلَى الجَاهِلِينَ بِالصُّرَاخِ.',v:false,fix:'عِبَادُ الرَّحْمَنِ يَقُولُونَ لِلْجَاهِلِينَ سَلَامًا.'}]},\n {ask:'اِخْتَرِ الكَلِمَةَ المُنَاسِبَةَ لِكُلِّ فَرَاغٍ.',t:'fill',\n  tpl:'تَجِبُ ___ عَلَى الأَغْنِيَاءِ، وَيَأْخُذُهَا ___. وَلَا تَجِبُ إِلَّا إِذَا بَلَغَ المَالُ ___ . وَمِنْ فَوَائِدِهَا أَنَّهَا تَنْشُرُ ___ بَيْنَ النَّاسِ، وَهِيَ الرُّكْنُ ___ مِنْ أَرْكَانِ الإِسْلَامِ.',\n  bank:['الزَّكَاةُ','الفُقَرَاءُ','النِّصَابَ','المَحَبَّةَ','الثَّالِثُ','الكُرْهَ','الرَّابِعُ']},\n {ask:'ضَعْ كُلَّ عَمَلٍ فِي العَمُودِ المُنَاسِبِ.',t:'cls',cols:['مِنَ الإِخْلَاصِ','مِنَ الرِّيَاءِ'],items:[\n  {t:'أَتَصَدَّقُ بِدُونِ أَنْ يَعْلَمَ بِذَلِكَ أَحَدٌ.',c:0},\n  {t:'أُتْقِنُ وَاجِبِي لِأَنَّ اللهَ يُحِبُّ ذَلِكَ.',c:0},\n  {t:'أَقْرَأُ القُرْآنَ لِكَيْ يَرْضَى اللهُ عَنِّي.',c:0},\n  {t:'أُصَلِّي جَيِّدًا لِأَنَّ النَّاسَ يَنْظُرُونَ إِلَيَّ.',c:1},\n  {t:'أَتَصَدَّقُ لِيَقُولَ النَّاسُ إِنَّنِي كَرِيمٌ.',c:1},\n  {t:'أُظْهِرُ عَمَلِي لِيَمْدَحَنِي الجَمِيعُ.',c:1}]},\n {ask:'اِخْتَرِ الجَوَابَ الصَّحِيحَ.',t:'qcm',list:[\n  {q:'لِمَاذَا كَانَ جِبْرِيلُ عَلَيْهِ السَّلَامُ يُوصِي بِالجَارِ؟',o:['لِأَنَّ حَقَّ الجَارِ عَظِيمٌ','لِأَنَّ الجَارَ غَنِيٌّ','لِأَنَّ الجَارَ بَعِيدٌ'],ex:'حَقُّ الجَارِ عَظِيمٌ فِي الإِسْلَامِ.'},\n  {q:'مَا هُوَ الإِيمَانُ بِالكُتُبِ السَّمَاوِيَّةِ؟',o:['رُكْنٌ مِنْ أَرْكَانِ الإِيمَانِ','عَادَةٌ جَمِيلَةٌ فَقَطْ','أَمْرٌ غَيْرُ وَاجِبٍ']},\n  {q:'كَيْفَ نَرُدُّ إِذَا قَالَ لَنَا الجَاهِلُ كَلَامًا سَيِّئًا؟',o:['نَقُولُ سَلَامًا وَنَبْتَعِدُ','نَغْضَبُ وَنَصْرُخُ','نَرُدُّ عَلَيْهِ بِالمِثْلِ']},\n  {q:'مَا الَّذِي يَنْفَعُ الوَلَدَ أَكْثَرَ؟',o:['العِلْمُ وَالأَخْلَاقُ','المَالُ الكَثِيرُ','اللِّبَاسُ الجَمِيلُ']},\n  {q:'لِمَاذَا نَطْلُبُ العِلْمَ؟',o:['لِنَعْرِفَ الخَيْرَ وَنُرْضِيَ اللهَ','لِنَفْخَرَ عَلَى أَصْدِقَائِنَا','لِنَجْمَعَ المَالَ']}]},\n {ask:'اِرْبِطْ كُلَّ مَعْنًى بِالكَلِمَةِ المُنَاسِبَةِ.',t:'match',pairs:[\n  ['مُرُورُ سَنَةٍ كَامِلَةٍ عَلَى المَالِ','الحَوْلُ'],\n  ['المَبْلَغُ الَّذِي إِذَا بَلَغَهُ المَالُ وَجَبَتِ الزَّكَاةُ','النِّصَابُ'],\n  ['التَّظَاهُرُ بِالعِبَادَةِ لِيَمْدَحَنَا النَّاسُ','الرِّيَاءُ'],\n  ['بِتَوَاضُعٍ وَسَكِينَةٍ','هَوْنًا'],\n  ['الَّذِينَ يَعْمَلُونَ الخَيْرَ لِإِرْضَاءِ اللهِ فَقَطْ','مُخْلِصِينَ'],\n  ['الَّذِينَ يَبْتَعِدُونَ عَنِ البَاطِلِ وَيَخْتَارُونَ دِينَ الإِسْلَامِ','حُنَفَاءُ']]},\n {ask:'ضَعْ كُلَّ تَصَرُّفٍ فِي العَمُودِ المُنَاسِبِ.',t:'cls',cols:['مِنَ الإِحْسَانِ إِلَى الجَارِ','لَيْسَ مِنَ الإِحْسَانِ إِلَى الجَارِ'],items:[\n  {t:'أُحَيِّيهِ بِابْتِسَامَةٍ.',c:0},\n  {t:'أُسَاعِدُهُ عِنْدَمَا يَحْتَاجُ إِلَيَّ.',c:0},\n ill'||d.t==='slots'?d.lt:'Géo';\nconst DATA2=[];\nDATA.forEach(d=>{\n  if(d.t==='tf'||d.t==='qcm'){const list=d.list.filter(x=>x.l.startsWith(PFX));if(list.length)DATA2.push(Object.assign({},d,{list}));}\n  else if((lOf(d)||'').startsWith(PFX))DATA2.push(d);\n});\nDATA.length=0;DATA2.forEach(x=>DATA.push(x));\n{const P=window.__PICK;if(P){const A=DATA.slice();DATA.length=0;P.forEach(i=>DATA.push(A[i]));}}\n/* ---------- assemblage ---------- */\n\nfunction rappelBox(){\n  const G=[['جَانْفِي','janvier'],['فِيفْرِي','février'],['مَارْس','mars'],['أَفْرِيل','avril'],['مَايْ','mai'],['جُوَان','juin'],['جُوِيلِيَة','juillet'],['أُوت','août'],['سِبْتَمْبِر','septembre'],['أُكْتُوبِر','octobre'],['نُوفَمْبِر','novembre'],['دِيسَمْبِر','décembre']];\n  const Hh=[['مُحَرَّم','Mouharram'],['صَفَر','Safar'],['رَبِيع الأَوَّل','Rabi\\' al-awwal'],['رَبِيع الثَّانِي','Rabi\\' ath-thani'],['جُمَادَى الأُولَى','Joumada al-oula'],['جُمَادَى الثَّانِيَة','Joumada ath-thania'],['رَجَب','Rajab'],['شَعْبَان','Chaabane'],['رَمَضَان','Ramadan'],['شَوَّال','Chawwal'],['ذُو القَعْدَة','Dhou al-qi\\'da'],['ذُو الحِجَّة','Dhou al-hijja']];\n  const wrapD=document.createElement('div');wrapD.className='rapw';\n  [['Calendrier grégorien (ميلادي)','Commence à la naissance de Jésus (paix sur lui).',G,'g'],['Calendrier hégirien (هجري)','Commence à l\\'Hégire du Prophète ﷺ (622).',Hh,'h']].forEach(([t,sub,L,c])=>{\n    const bx=document.createElement('div');bx.className='rap '+c;\n    const h=document.createElement('div');h.className='rt';h.textContent=t;bx.appendChild(h);\n    const p=document.createElement('div');p.className='rs';p.textContent=sub;bx.appendChild(p);\n    const m=document.createElement('div');m.className='rm';\n    L.forEach(x=>{const e=document.createElement('span');e.innerHTML='<b>'+x[0]+'<\/b><i>'+x[1]+'<\/i>';m.appendChild(e);});\n    bx.appendChild(m);wrapD.appendChild(bx);});\n  return wrapD;\n}\nlet doneSet=new Set();\nfunction start(){\n  doneSet=new Set();document.getEle ,en:"<!DOCTYPE html>\n<html lang=\"en\" dir=\"ltr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>English revision<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#fdf8ee;--card:#fff;--ink:#1f2937;--muted:#6b7280;--teal:#0f766e;--green:#16a34a;--red:#dc2626}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;background:var(--bg);color:var(--ink);font-family:\"Nunito\",\"Trebuchet MS\",system-ui,Arial,sans-serif;touch-action:manipulation}\n.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}\nh1{font-size:32px;margin:0 0 12px;color:#be185d;line-height:1.5}\n.card{background:var(--card);border-radius:22px;box-shadow:0 2px 14px rgba(0,0,0,.08);padding:20px 22px;margin:0 0 22px;border:3px solid transparent}\n.card.done{border-color:var(--green)!important}\n.card h2{margin:0 0 6px;line-height:0;display:flex;align-items:center;gap:12px}\n.badge{width:56px;height:56px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font:800 30px/1 system-ui,sans-serif}\n.tag{font:700 15px/1.6 system-ui,sans-serif;color:#475569;background:#f1f5f9;border-radius:10px;padding:3px 12px}\n.ask{font-size:26px;line-height:1.6;margin:8px 0 12px;font-weight:800}\n.intro{font-size:25px;line-height:1.8;margin:6px 0 12px;background:#f8fafc;border-radius:14px;padding:10px 16px}\n.fb{margin-top:10px;border-radius:14px;padding:8px 14px;font-size:23px;line-height:1.7;display:none;font-weight:700}\n.fb.good{display:block;background:#dcfce7;color:#14532d}\n.fb.bad{display:block;background:#fee2e2;color:#7f1d1d}\n.chk{font:800 26px \"Nunito\",system-ui,sans-serif;margin:12px 0 4px;padding:10px 30px;border-radius:16px;border:3px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}\n.chk:disabled{opacity:.4}\n.chk:active{transform:scale(.97)}\n.match{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px}\n.mcol{display:flex;flex-direction:column;gap:12px}\n.itm{font:700 25px/1.5 \"Nunito\",system-ui,sans-serif;padding:10px 14px;min-height:64px;border-radius:16px;border:3px solid #cbd5e1;background:#fff;color:var(--ink);cursor:pointer;text-align:center;user-select:none;-webkit-user-select:none}\n.itm.big{font-size:36px}\n.itm:active{transform:scale(.97)}\n.itm.sel{border-color:#f59e0b;background:#fef3c7;box-shadow:0 0 0 4px #fde68a}\n.itm.lk{border-width:4px}\n.itm.ok{pointer-events:none}\n.itm.ok::after{content:\"\";display:inline-block;width:.75em;height:.75em;margin-inline-start:.35em;vertical-align:-.05em;background:url(\"data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M5 12.5l4.5 4.5L19 7.5' fill='none' stroke='%2315803d' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E\") center/contain no-repeat}\n.itm.bad{border-color:var(--red)!important;background:#fee2e2!important}\n.para{font-size:28px;line-height:2.5;margin:6px 0 12px}\n.blank{display:inline-block;min-width:130px;min-height:50px;padding:2px 14px;margin:0 4px;border-radius:12px;border:3px dashed #94a3b8;background:#f8fafc;font:800 26px/1.7 \"Nunito\",system-ui,sans-serif;color:var(--ink);cursor:pointer;vertical-align:middle;text-align:center}\n.blank.s{min-width:64px;padding:2px 8px}\n.blank.filled{border-style:solid;border-color:#0f766e;background:#f0fdfa}\n.blank.armed{border-color:#f59e0b;background:#fef3c7}\n.blank.ok{border-color:var(--green);background:#dcfce7;pointer-events:none}\n.blank.bad{border-color:var(--red);background:#fee2e2}\n.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;padding:12px;background:#f8fafc;border-radius:18px;justify-content:center}\n.chip{font:800 26px \"Nunito\",system-ui,sans-serif;padding:8px 20px;min-height:56px;border-radius:16px;border:3px solid #cbd5e1;background:#fff;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none}\n.chip:active{transform:scale(.96)}\n.chip.sel{border-color:#f59e0b;background:#fef3c7;box-shadow:0 0 0 4px #fde68a}\n.chip.used{opacity:.3;pointer-events:none}\n.chip.bad{border-color:var(--red);background:#fee2e2}\n.chip.good{border-color:var(--green);background:#dcfce7}\n.cols{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:12px;margin-top:10px}\n.col{border-radius:18px;border:3px solid;min-height:150px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}\n.col .hd{font-size:25px;font-weight:800;text-align:center;padding:10px 6px;color:#fff;line-height:1.5}\n.col .bd{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px}\n.col.k0{border-color:#15803d;background:#f0fdf4}.col.k0 .hd{background:#15803d}\n.col.k1{border-color:#be185d;background:#fdf2f8}.col.k1 .hd{background:#be185d}\n.col.k2{border-color:#1d4ed8;background:#eff6ff}.col.k2 .hd{background:#1d4ed8}\n.col.armed{box-shadow:0 0 0 4px #fde68a}\n.pl{font:700 24px/1.6 \"Nunito\",system-ui,sans-serif;background:#fff;border:2px solid #94a3b8;border-radius:14px;padding:6px 10px;cursor:pointer;text-align:center}\n.pl.ok{background:#dcfce7;border-color:var(--green);pointer-events:none}\n.pl.bad{background:#fee2e2;border-color:var(--red)}\n.tray{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 6px;padding:12px;background:#f8fafc;border-radius:18px;justify-content:center}\n.tray:empty{display:none}\n.tray .pl.sel{border-color:#f59e0b;background:#fef3c7;box-shadow:0 0 0 4px #fde68a}\n.row{padding:10px 0;border-bottom:2px dashed #e2e8f0}\n.row:last-child{border-bottom:0}\n.stmt{font-size:26px;line-height:1.7;font-weight:700}\n.tf{display:flex;gap:10px;margin-top:6px}\n.tfb{flex:1;min-width:0;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 8px;border-radius:14px;border:2px solid #cbd5e1;box-shadow:0 3px 0 #cbd5e1;background:#fff;color:#0B2A5B;font:700 24px/1.4 \"Nunito\",system-ui,sans-serif;cursor:pointer;transition h ---------- */\nconst ONCE=f=>{let d=0;return(...a)=>{if(!d){d=1;f(...a);}};};/* une carte n'est comptée « faite » qu'une fois */function buildMatch(body,pairs,done,bigLeft){done=ONCE(done);\n  const n=pairs.length;\n  const A=pairs.map((p,i)=>({t:p[0],i,l:p[2]})),B=shuffle(pairs.map((p,i)=>({t:p[1],i})));\n  let links=[],selA=null,selB=null,fin=false;\n  const grid=T('div','match'),cA=T('div','mcol'),cB=T('div','mcol');grid.append(cA,cB);body.appendChild(grid);\n  const chk=T('button','chk','Check');body.appendChild(chk);const fb=T('div','fb');body.appendChild(fb);\n  const lk=(side,i)=>links.find(l=>l[side]===i);\n  function draw(){\n    cA.textContent='';cB.textContent='';\n    [[A,cA,'a',selA],[B,cB,'b',selB]].forEach(([arr,col,side,sel])=>arr.forEach(it=>{\n      const isI=it.t.startsWith('[[img:');const b=T('button','itm'+(bigLeft&&side==='a'?' big':'')+(isI?' img':''));rich(b,it.t);const l=lk(side,it.i);\n      if(l){b.classList.add('lk');b.style.borderColor=LCOL[l.c];b.style.background=LCOL[l.c]+'22';if(l.s)b.classList.add(l.s);}\n      else if(sel===it.i)b.classList.add('sel');\n      b.onclick=()=>{\n        if(fin)return;\n        const x=lk(side,it.i);\n        if(x){links=links.filter(y=>y!==x);fb.className='fb';}\n        else{if(side==='a')selA=(selA===it.i?null:it.i);else selB=(selB===it.i?null:it.i);\n          if(selA!==null&&selB!==null){const used=links.map(y=>y.c);let c=0;while(used.includes(c))c++;links.push({a:selA,b:selB,c,s:''});selA=null;selB=null;}}\n        draw();};\n      col.appendChild(b);}));\n  }\n  chk.onclick=()=>{\n    if(links.length<n){setFb(fb,'bad','Match all of them first.');return;}done();\n    let bad=0;links.forEach(l=>{if(l.s==='ok')return;if(l.a===l.b)l.s='ok';else{if(l.s!=='bad')LOGE(body,A[l.a].t+' ↔ '+B.find(x=>x.i===l.b).t,'',A[l.a].l);l.s='bad';bad++;}});\n    draw();\n    if(bad)setFb(fb,'bad','Some links are wrong. Touch them to remove them, then try again.');\n    else{fin=true;chk.disabled=true;setFb(fb,'good',OKM);done();}\n  };\n  draw();\n}\n\n/* ---------- fill (word / letter bank) ---------- */\nfunction buildFill(body,tpl,ans,bank,lt,done,small){done=ONCE(done);\n  const parts=tpl.split('___');const nb=ans.length;\n  const chips=shuffle(bank.map((t,i)=>({t,id:i})));\n  const place=Array(nb).fill(null),st=Array(nb).fill('');\n  let armedC=null,armedB=null,fin=false;\n  const para=T('div','para'),tray=T('div','chips');body.append(para,tray);\n  const chk=T('button','chk','Check');body.appendChild(chk);const fb=T('div','fb');body.appendChild(fb);\n  const put=(c,b)=>{place[b]=c;st[b]='';armedC=null;armedB=null;fb.className='fb';draw();};\n  function draw(){\n    para.textContent='';\n    parts.forEach((p,i)=>{\n      p.split('\\n').forEach((s,k)=>{if(k)para.appendChild(document.createElement('br'));rich(para,s);});\n      if(i<nb){\n        const bl=document.createElement('button');bl.className='blank'+(small?' s':'');\n        if(place[i]!==null){bl.classList.add('filled');if(st[i])bl.classList.add(st[i]);bl.textContent=bank[place[i]];}\n        else if(armedB===i)bl.classList.add('armed');\n        else bl.innerHTML='&nbsp;';\n        bl.onclick=()=>{\n          if(fin||st[i]==='ok')return;\n          if(place[i]!==null){if(armedC!==null){put(armedC,i);}else{place[i]=null;st[i]='';fb.className='fb';draw();}}\n          else if(armedC!==null)put(armedC,i);\n          else{armedB=(armedB===i?null:i);draw();}\n        };\n        para.appendChild(bl);\n      }\n    });\n    tray.textContent='';\n    chips.forEach(c=>{\n      const b=T('button','chip',c.t);\n      if(place.includes(c.id))b.classList.add('used');\n      else if(armedC===c.id)b.classList.add('sel');\n      b.onclick=()=>{if(armedB!==null)put(c.id,armedB);else{armedC=(armedC===c.id?null:c.id);draw();}};\n      tray.appendChild(b);});\n  }\n  chk.onclick=()=>{\n    if(place.includes(null)){setFb(fb,'bad','Fill all the blanks first.');return;}done();\n    let bad=0;place.forEach((c,i)=>{if(st[i]==='ok')return;const a=Array.isArray(ans[i])?ans[i]:[ans[i]];\n      if(a.includes(bank[c]))st[i]='ok';\n      else{if(st[i]!=='bad')LOGE(body,bank[c],parts[i].slice(-120)+' ___ '+(parts[i+1]||'').slice(0,50),lt);st[i]='bad';bad++;}});\n    draw();\n    if(bad)setFb(fb,'bad',BADM);\n    else{fin=true;chk.disabled=true;setFb(fb,'good',OKM);done();}\n  };\n  draw();\n}\n\n/* several fill exercises in one card */\nfunction buildMulti(body,list,done){done=ONCE(done);\n  let left=list.length;\n  list.forEach(x=>{const s=T('div','sub');body.appendChild(s);buildFill(s,x.tpl,x.ans,x.bank,x.lt,()=>{if(--left===0)done();},x.small);});\n}\n\n/* ---------- classify ---------- */\nfunction buildClassify(body,cols,items,done){done=ONCE(done);\n  const pos=items.map(()=>-1),st=items.map(()=>'');const order=shuffle(items.map((_,i)=>i));\n  let armed=null,fin=false;\n  const tray=T('div','tray'),grid=T('div','cols');grid.style.setProperty('--n',cols.length);body.append(tray,grid);\n  const chk=T('button','chk','Check');body.appendChild(chk);const fb=T('div','fb');body.appendChild(fb);\n  function draw(){\n    tray.textContent='';grid.textContent='';\n    order.forEach(i=>{if(pos[i]!==-1)return;const b=T('button','pl',items[i].t);if(armed===i)b.classList.add('sel');\n      b.onclick=()=>{armed=(armed===i?null:i);draw();};tray.appendChild(b);});\n    cols.forEach((c,ci)=>{\n      const col=T('div','col k'+ci);if(armed!==null)col.classList.add('armed');\n      col.appendChild(T('div','hd',c));const bd=T('div','bd');col.appendChild(bd);\n      order.forEach(i=>{if(pos[i]!==ci)return;const b=T('button','pl',items[i].t);if(st[i])b.classList.add(st[i]);\n        b.onclick=ev=>{ev.stopPropagation();if(fin||st[i]==='ok')return;pos[i]=-1;st[i]='';fb.className='fb';draw();};bd.appendChild(b);});\n      col.onclick=()=>{if(fin||armed===null)return;pos[armed]=ci;st[armed]='';armed=null;fb.className='fb';draw();};\n      grid.appendChild(col);});\n  }\n  chk.onclick=()=>{\n    if(pos.includes(-1)){setFb(fb,'bad','Put all the words in a column first.');return;}done();\n    let bad=0;items.forEach((it,i)=>{if(st[i]==='ok')return;if(pos[i]===it.c)st[i]='ok';else{if(st[i]!=='bad')LOGE(body,it.t,'',it.l);st[i]='bad';bad++;}});\n    draw();\n    if(bad)setFb(fb,'bad',BADM);\n    else{fin=true;chk.disabled=true;setFb(fb,'good',OKM);done();}\n  };\n  draw();\n}\n\n/* ---------- true / false ---------- */\nfunction buildTF(body,list,done){done=ONCE(done);\n  let left=list.length;\n  list.forEach((s,i)=>{\n    const row=T('div','row');row.dataset.l=s.l||'';row.appendChild(T('div','stmt',(i+1)+') '+s.t));\n    const tf=T('div','tf');const fb=T('div','fb');let sn=0;const seen=()=>{if(!sn){sn=1;if(--left===0)done();}};\n    [['True',true],['False',false]].forEach(([lab,v])=>{\n      const b=T('button','tfb',lab);b.insertAdjacentHTML('beforeend',v?'<span class=\"tfi v\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M5 12.5l4.5 4.5L19 7.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>':'<span class=\"tfi f\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M6 6l12 12M18 6L6 18\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/span>');\n      b.onclick=()=>{\n        if(v!==s.v){b.classList.add('bad');shake(b);setFb(fb,'bad',BAD);seen();return;}\n        tf.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add('good');\n        setFb(fb,'good',s.v?OKM:OKM+' '+s.fix);\n        seen();};\n      tf.appendChild(b);});\n    row.append(tf,fb);body.appendChild(row);});\n}\n\n/* ---------- multiple choice (first option = correct) ---------- */\nfunction buildQCM(body,list,done){done=ONCE(done);\n  let left=list.length;\n  list.forEach((q,i)=>{\n    const row=T('div','row qcm');row.dataset.l=q.l||'';row.appendChild(rich(T('div','stmt'),(i+1 const fbFn=function(){

    if(en){title=ok?'Well done!':t;t=ok?t.replace(/^Well done!\s*/,''):'';}
    else if(ok){title='أَحْسَنْتَ !';t=t.replace(/^(🎉\s*)?أَحْسَنْتَ\s*!\s*/,'');}
    else{const m=t.match(/^اِنْتَبِهْ\s*!\s*/);
      if(m){title='اِنْتَبِهْ !';t=t.slice(m[0].length);}
      else{title=/أَوَّلًا\.$/.test(t)?'اِنْتَبِهْ !':'لَا، حَاوِلْ مَرَّةً أُخْرَى';t=t.replace(/^(لَا،\s*)?حَاوِلْ مَرَّةً أُخْرَى\s*[.!]\s*/,'');}
      t=t.replace(/^تَلْمِيحٌ\s*:\s*/,'');}
    fb.className='fb '+cls;fb.textContent='';fb.dir=en?'ltr':'rtl';
    const h=document.createElement('div');h.className='fbh';h.textContent=title;fb.appendChild(h);
    if(t){const d=document.createElement('div');d.className=ok?'fbd':'fbi';
      if(/^\{[^{}]*\}\.?$/.test(t)){d.dir='ltr';d.textContent=t.replace(/^\{|\}\.?$/g,'');}
      else if(typeof wrap==='function')wrap(t,d);else d.textContent=t;
      fb.appendChild(d);}

const SOLVER_JS="(function(){\nconst cl=e=>{if(e)e.dispatchEvent(new MouseEvent('click',{bubbles:true}));};\nconst tx=e=>e.textContent.trim();\nfunction solve(d,c){\n if(d.t==='tf'){c.querySelectorAll('.row').forEach((r,k)=>{const b=r.querySelectorAll('.tfb');cl(d.list[k].v?b[0]:b[1]);});}\n else if(d.t==='qcm'){c.querySelectorAll('.row').forEach((r,k)=>{cl([...r.querySelectorAll('.chip')].find(x=>tx(x)===d.list[k].o[0]));});}\n else if(d.t==='match'){const A=[...c.querySelectorAll('.mcol')[0].children];d.pairs.forEach((p,k)=>{\n    cl(A[k]);const B=[...c.querySelectorAll('.mcol')[1].children].find(x=>tx(x)===p[1]&&!x.classList.contains('lk'));cl(B);});cl(c.querySelector('.chk'));}\n else if(d.t==='cls'){d.items.forEach(it=>{cl([...c.querySelectorAll('.tray .pl')].find(x=>tx(x)===it.t));cl(c.querySelectorAll('.col')[it.c]);});cl(c.querySelector('.chk'));}\n else if(d.t==='fill'||d.t==='slots'||d.t==='multi'){\n   const subs=d.t==='multi'?d.list.map((x,k)=>[x,c.querySelectorAll('.sub')[k]]):[[d,c]];\n   subs.forEach(([q,sc])=>{const used=[];const ans=d.t==='slots'?q.bank:q.ans||q.bank.slice(0,sc.querySelectorAll('.blank').length);// sans champ ans : le trou i attend bank[i]\n     for(let b=0;b<ans.length;b++){const opts=Array.isArray(ans[b])?ans[b]:[ans[b]];let chip=null,pick=null;\n       for(const o of opts){if(used.includes(o)&&opts.length>1)continue;chip=[...sc.querySelectorAll('.chips .chip:not(.used)')].find(x=>tx(x)===o);if(chip){pick=o;break;}}\n       used.push(pick);cl(chip);cl(sc.querySelectorAll('.blank')[b]);}\n     cl(sc.querySelector('.chk'));});}\n else if(d.t==='globe'){const chip=t=>[...c.querySelectorAll('.chips .chip:not(.used)')].find(x=>tx(x)===t);\n   cl(chip(d.prompts[1]));cl(c.querySelector('#geq'));cl(chip(d.prompts[0]));cl(c.querySelector('#gtr'));cl(c.querySelector('.chk'));}\n else if(d.t==='maplabel'){for(const ct of CT){cl([...c.querySelectorAll('.chips .chip:not(.used)')].find(x=>tx(x)===ct.ar));cl(c.querySelector('.cty[data-id='+ct.id+']'));}cl(c.querySelector('.chk'));}\n else if(d.t==='ord'){d.nums.slice().sort((a,b)=>d.sign==='<'?a-b:b-a).forEach(v=>cl(c.querySelector('.chips .chip:not(.used)[data-v=\"'+v+'\"]')));cl(c.querySelector('.chk'));}\n else if(d.t==='worldmap'){for(const ct of WM){cl([...c.querySelectorAll('.chips .chip:not(.used)')].find(x=>tx(x)===ct.ar));cl(c.querySelector('.cty[data-id='+ct.id+']'));}cl(c.querySelector('.chk'));}\n}\nsetTimeout(function(){try{\n const n=parseInt(window.__SOLVE_N,10)-1,cs=[...document.querySelectorAll('.card')];\n if(!(n>=0)||!cs[n]||typeof DATA==='undefined')return;\n try{solve(DATA[n],cs[n]);}catch(x){}\n setTimeout(function(){cs.forEach((c,i)=>{if(i!==n)c.remove();});},50);\n}catch(x){}},400);\n})();\n";
function snapFrame(e){

    const t=document.createElement('div');t.textContent=lbl;t.style.cssText='font:700 15px system-ui,sans-serif;margin:10px 0 4px;color:'+col;box.appendChild(t);
    const f=document.createElement('iframe');
    f.style.cssText='display:block;flex:none;width:100%;height:520px;border:3px solid '+col+';border-radius:12px;background:#fdf8ee';
    const i=s.lastIndexOf('</body>');
    f.srcdoc=i<0?s+inj:s.slice(0,i)+inj+s.slice(i);
    f.onload=()=>{try{const h=f.contentDocument.documentElement.scrollHeight;if(h>80)f.style.height=Math.min(1600,h+12)+'px';}catch(x){}};
    box.appendChild(f);};
  const snapInj=css+'<script>(function(){try{const S='+JSON.stringify(e.snap||'').split('</').join('<\\/')+';const cs=[...document.querySelectorAll(".card")];if(cs.length){const t=document.createElement("div");t.innerHTML=S;const n=t.firstElementChild;n.querySelectorAll("img[data-k]").forEach(i=>{try{i.src=IMG[i.dataset.k];}catch(x){}});cs[0].replaceWith(n);cs.slice(1).forEach(c=>c.remove());}}catch(x){}})()<\/script>';
  if(e.snap)mk(snapInj,'❌ Ce qu’Ilyas a répondu','#dc2626');
  const n=parseInt(e.card,10);
  const convOk='<script>(function(){try{document.querySelectorAll(".card td.cell").forEach(td=>{td.textContent=td.dataset.e||"";td.className="cell"+(td.dataset.e?" okc":"");});document.querySelectorAll(".card .line input[data-a]").forEach(i=>{i.value=i.dataset.a;i.parentNode.style.opacity="1";});document.querySelectorAll(".card .fb").forEach(x=>x.remove());}catch(x){}})()<\/script>';
  if(e.ex==='conv'&&e.snap&&/data-e=/.test(e.snap))mk(snapInj+convOk,'✅ La bonne réponse','#16a34a');
  else if(n>0)mk(css+'<script>window.__SOLVE_N='+n+';<\/script><script>'+SOLVER_JS.split('</').join('<\\/')+'<\/script>','✅ La bonne réponse','#16a34a');
  return box;
}
let repDetail=false,repMsg='';
const XKEY='ilyasLastExportV1';
const fwhen=t=>{const d=new Date(t);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});};
const validSave=d=>!!d&&typeof d==='object'&&d.app==='ikhtibar'&&d.version===1&&d.split==='15b'&&!!d.done&&typeof d.done==='object'&&!Array.isArray(d.done)&&Array.isArray(d.log)&&(d.state==null||(typeof d.state==='object'&&!Array.isArray(d.state)));
const readState=()=>{try{const o=JSON.parse(localStorage.getItem('ilyasStateV1')||'{}');return o&&typeof o==='object'&&!Array.isArray(o)?o:{};}catch(e){return {};}};
// avancée importée : on garde seulement des exercices bien formés et des gestes connus (rejoués comme clics ou saisies)
const cleanState=o=>{const r={};Object.keys(o).forEach(k=>{const x=o[k];if(x&&typeof x==='object'&&typeof x.seed==='number'&&Array.isArray(x.ev))r[k]=Object.assign({},x,{rr:x.rr&&typeof x.rr==='object'?x.rr:{},ev:x.ev.filter(e=>e&&typeof e==='object'&&/^(c|i|k|pd|pm|pu|pc)$/.test(e.ty))});});return r;};
// Les captures (snap) sont réinjectées en HTML : on écarte celles qui contiennent du code (les exercices n'en ont jamais).
const cleanLog=l=>l.filter(e=>e&&typeof e==='object'&&typeof e.t==='number').map(e=>{if(e.snap!=null&&(typeof e.snap!=='string'||/<script|\son[a-z]+\s*=|javascript:/i.test(e.snap)))delete e.snap;return e;});
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function saveCard(w,el){
  const c=el('div','box');
  c.appendChild(el('h2','ct','Sauvegarde de la progression d\'Ilyas'));
  c.appendChild(el('p','muted','Un seul petit fichier avec les exercices faits et les erreurs. À garder sur ton téléphone ou dans ton mail.'));
  const acts=el('div','acts big');const ex=el('button','b3','Exporter la sauvegarde'),im=el('button','b3 sec','Importer une sauvegarde');acts.append(ex,im);c.appendChild(acts);
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.hidden=true;c.appendChild(inp);
  const last=el('p','muted');last.style.margin='8px 0 0';
  const showLast=()=>{const t=+lsGet(XKEY)||0;last.textContent=t?'Dernière sauvegarde exportée : '+fwhen(t):'Aucune sauvegarde exportée pour l\'instant.';};showLast();c.appendChild(last);
  c.appendChild(el('p','warn','Importer remplace la progression actuelle de cette tablette (une confirmation sera demandée).'));
  const msg=el('p','smsg');c.appendChild(msg);
  const say=(t,bad)=>{msg.textContent=t;msg.style.color=bad?'#b91c1c':'#0B2A5B';};
  if(repMsg){say(repMsg);repMsg='';}
  ex.onclick=()=>{
    let json,name;
    try{const d=new Date(),p=n=>String(n).padStart(2,'0');
      json=JSON.stringify({app:'ikhtibar',version:1,split:'15b',exportedAt:d.toISOString(),done:DONE,log:LOG,state:readState()});
      name='ilyas-sauvegarde-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';
      const u=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
    }catch(e){say('L\'export a échoué. Réessaie.',true);return;}
    try{localStorage.setItem(XKEY,String(Date.now()));}catch(e){}
    showLast();say('Sauvegarde exportée : '+name);
    try{const f=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Sauvegarde d\'Ilyas'}).catch(()=>{});}catch(e){}
  };
  im.onclick=()=>{say('');inp.click();};
  inp.onchange=()=>{const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
    const r=new FileReader();r.onerror=()=>say('Impossible de lire ce fichier.',true);
    r.onload=()=>{let d=null;try{d=JSON.parse(r.result);}catch(e){}
      if(d&&d.app==='ikhtibar'&&d.split!=='15b'){say('Cette sauvegarde vient d\'une ancienne version et ne peut pas être importée.',true);return;}
      if(!validSave(d)){say('Ce fichier n\'est pas une sauvegarde d\'Ilyas.',true);return;}
      say('');const old=c.querySelector('.cfm');if(old)old.remove();
      const box=el('div','cfm');box.appendChild(el('p',null,'Importer remplace la progression actuelle de cette tablette. Continuer ?'));
      const a=el('div','acts big');const no=el('button','b3 sec','Annuler'),yes=el('button','b3','Remplacer');a.append(no,yes);box.appendChild(a);c.appendChild(box);
      try{box.scrollIntoView({block:'nearest'});}catch(e){}
      no.onclick=()=>box.remove();
      yes.onclick=()=>{const log=cleanLog(d.log),pd=lsGet('ilyasDoneV1'),pl=lsGet(LKEY),ps=lsGet('ilyasStateV1');
        try{localStorage.setItem('ilyasDoneV1',JSON.stringify(d.done));localStorage.setItem(LKEY,JSON.stringify(log));if(d.state)localStorage.setItem('ilyasStateV1',JSON.stringify(cleanState(d.state)));else localStorage.removeItem('ilyasStateV1');}
        catch(e){try{if(pd==null)localStorage.removeItem('ilyasDoneV1');else localStorage.setItem('ilyasDoneV1',pd);if(pl==null)localStorage.removeItem(LKEY);else localStorage.setItem(LKEY,pl);if(ps==null)localStorage.removeItem('ilyasStateV1');else localStorage.setItem('ilyasStateV1',ps);}catch(e2){}
          box.remove();say('L\'import a échoué (mémoire de la tablette pleine ?). Rien n\'a été changé.',true);return;}
        DONE=d.done;LOG=log;
        try{sessionStorage.setItem('ilyasImported','1');}catch(e){}
        box.remove();say('Sauvegarde importée');location.reload();};
    };r.readAsText(f);};
  w.appendChild(c);
}
function renderRep(){
  const host=$('rep');host.textContent='';const w=document.createElement('div');w.className='rw';host.appendChild(w);
  const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n;};
  saveCard(w,el);
  const subs=SUBJ.filter(s=>s.ex.length).map(s=>s.fr);

  const since=repRange===1?new Date().setHours(0,0,0,0):repRange?Date.now()-repRange*864e5:0;
  const ev=LOG.filter(e=>e.t>=since&&((EXN[e.ex]||{}).subj===repSubj));

  const a1=el('div','acts');

  cr.appendChild(a1);
  const a2=el('div','acts');
  [[1,'Aujourd\'hui'],[7,'7 derniers jours'],[0,'Tout']].forEach(([r,l])=>{const b=el('button','b'+(repRange===r?' on':''),l);b.onclick=()=>{repRange=r;renderRep();};a2.appendChild(b);});
  cr.appendChild(a2);
  const big=el('div','big');big.appendChild(el('b',null,String(errs.length)));
  big.appendChild(el('span',null,(errs.length>1?'erreurs ':'erreur ')+(repRange===1?'aujourd\'hui':repRange?'en '+repRange+' jours':'en tout')+(ev.length?' · dernière activité le '+fwhen(ev[ev.length-1].t):'')));

  if(!errs.length){cr.appendChild(el('p','muted','Aucune erreur enregistrée en '+repSubj+' sur cette période.'));}
  else{
    const g={};errs.forEach(e=>{(g[grp(e)]=g[grp(e)]||[]).push(e);});

    order.forEach(([k,l])=>{const r=el('div','bar');r.appendChild(el('div','n',k));const t=el('div','t'),i=el('i');i.style.width=Math.max(6,l.length/mx*100)+'%';t.appendChild(i);r.appendChild(t);r.appendChild(el('div','c',String(l.length)));cr.appendChild(r);});
    const pa=el('div','acts big');
    const pb=el('button','b3','PDF pour papa ('+errs.length+' erreur'+(errs.length>1?'s':'')+')');pb.onclick=()=>openPdf(errs,repSubj,repRange===1?'aujourd\'hui':repRange?repRange+' derniers jours':'tout l\'historique');
    const db=el('button','b3 sec');pa.append(pb,db);cr.appendChild(pa);
    const det=el('div');det.appendChild(el('h3',null,'Détail par '+(repSubj==='Maths'?'exercice':'leçon')));
    order.forEach(([k,l])=>{
      const d=document.createElement('details');d.className='det';d.open=true;
      d.appendChild(el('summary',null,k+' — '+l.length+' erreur'+(l.length>1?'s':'')));
      l.slice(-12).reverse().forEach(e=>{const r=el('div','ev');r.appendChild(el('small',null,fdate(e.t)+(e.card?' · n°'+e.card:'')));
        const qq=e.q||e.seg||e.ask||'';if(qq)r.appendChild(el('div','ar',qq));
        if(e.a){const x=el('div',null,'Sa réponse : ');x.appendChild(el('span','ar',e.a));r.appendChild(x);}
        if(e.snap){const bt=el('button','b','Voir l\'erreur et la bonne réponse');let f2=null;bt.onclick=()=>{if(f2){f2.remove();f2=null;bt.textContent='Voir l\'erreur et la bonne réponse';return;}f2=snapFrame(e);r.appendChild(f2);bt.textContent='Masquer l\'exercice';};bt.style.marginTop='6px';r.appendChild(bt);}
        d.appendChild(r);});
      det.appendChild(d);
    });
    const sync=()=>{det.hidden=!repDetail;db.textContent=repDetail?'Masquer le détail des erreurs':'Voir le détail des erreurs';};

  w.appendChild(a3);

const PDF_CSS="body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#0f172a;margin:0;background:#fff}.pg{max-width:860px;margin:0 auto;padding:18px}.pg h1{font-size:26px;margin:0 0 4px;color:#0f766e}.pg .sub{color:#475569;font-size:15px;margin-bottom:14px}.pg h2{font-size:21px;margin:22px 0 8px;color:#0f766e;border-bottom:2px solid #99f6e4;padding-bottom:4px;break-after:avoid}.pg .pbox{border:1px solid #cbd5e1;border-radius:12px;padding:10px 14px;margin:0 0 12px}.pg .pbox small{color:#64748b}.pg .ar{direction:rtl;font-size:20px;line-height:1.9;font-family:'Noto Naskh Arabic','Noto Sans Arabic',Tahoma,Arial,sans-serif}.pg iframe{display:block;width:100%;border-radius:10px}@page{size:A4;margin:12mm}@media print{.noprint{display:none!important}}";
